# Gateway del staging efímero: rutea igual que k8s/ingress.yaml. No agrega cabeceras de seguridad
# a propósito: ZAP tiene que ver las que entregan la API y el frontend por sí solos.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Semillas para el spider de ZAP: el portal es una SPA y sin esto ZAP solo vería index.html.
  # Con el token de la cuenta del scanner (ZAP_AUTH_HEADER_VALUE) recorre también respuestas reales de la API.
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /portal.html\nAllow: /health\nAllow: /v1/me\nAllow: /v1/courses\nAllow: /v1/me/grades\n";
  }

  location /v1 {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
  }

  location = /health {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
  }
}
