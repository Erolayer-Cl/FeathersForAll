# Reglas de lint del contrato AulaViva. Uso (sin instalar nada):
#   npx @stoplight/spectral-cli lint api/openapi.yaml
extends: ["spectral:oas"]
rules:
  # Reglas base endurecidas
  operation-operationId: error
  operation-tags: error
  operation-description: warn
  oas3-api-servers: error
  info-contact: error
  info-license: error

  aulaviva-paths-kebab-case:
    description: Los paths usan kebab-case (recursos, no verbos).
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[a-zA-Z]+\\}))+$"

  aulaviva-no-verbs-in-path:
    description: Los paths no contienen verbos (create, get, update, delete).
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: "/(create|get|update|delete|list)"

  aulaviva-servers-versioned:
    description: Todos los servers terminan en /v1 (versionado explícito).
    severity: error
    given: $.servers[*].url
    then:
      function: pattern
      functionOptions:
        match: "/v[0-9]+$"

  aulaviva-errors-rfc7807:
    description: Las respuestas 4xx/5xx usan application/problem+json (RFC 7807).
    severity: error
    given: $.components.responses[*].content
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: ["application/problem+json"]

  aulaviva-post-idempotency:
    description: Los POST declaran el header Idempotency-Key.
    severity: error
    given: $.paths[*].post
    then:
      field: parameters
      function: truthy

  aulaviva-success-trace-id:
    description: Las respuestas 2xx exponen X-Trace-Id.
    severity: warn
    given: $.paths[*][*].responses[?(@property.match(/^2/))]
    then:
      field: headers.X-Trace-Id
      function: truthy

  aulaviva-snake-case-properties:
    description: Propiedades JSON en snake_case.
    severity: warn
    given: $..properties[*]~
    then:
      function: casing
      functionOptions:
        type: snake
