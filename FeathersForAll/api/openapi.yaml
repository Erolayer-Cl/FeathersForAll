openapi: 3.1.0
info:
  title: AulaViva API
  version: 1.0.0
  summary: API pública del monolito modular de AulaViva (FeathersForAll).
  description: |
    Contrato contract-first de AulaViva. Fuente de verdad para backend (Node.js + Express),
    frontend (HTML/CSS/JS en Vercel) y cliente TypeScript generado.

    **Multi-tenancy:** el tenant (colegio) NO viaja en la URL. Se obtiene del token JWT
    (claim `tenant_id`) y el backend lo fija por transacción en PostgreSQL (RLS, ADR 0002 D1).
    Un recurso de otro colegio responde `404` (no se revela su existencia).

    **Errores:** todos los errores usan RFC 7807 (`application/problem+json`) con `trace_id`.

    **Idempotencia:** los POST que crean recursos exigen `Idempotency-Key` (UUID). El servidor
    guarda la respuesta por clave durante 24 h.

    **Mock:** `npx @stoplight/prism-cli mock api/openapi.yaml` sirve los paths sin prefijo en http://127.0.0.1:4010.

    **Versionado:** prefijo `/v1`. Política en `Documentos/api/versioning-policy.md`.
  contact:
    name: Equipo AulaViva (FeathersForAll)
    url: https://github.com/Erolayer-Cl/FeathersForAll
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.aulaviva.example/v1
    description: Producción (Render) — URL definitiva por confirmar
  - url: https://staging-api.aulaviva.example/v1
    description: Staging (Render)
  - url: http://localhost:3000/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Cursos
    description: Gestión de cursos y matrícula (H1).
  - name: Evaluaciones
    description: Creación, publicación y rendición de evaluaciones auto-corregidas (H2, H4).
  - name: Resultados
    description: Dashboard de resultados para el docente (H3).
  - name: Tutor IA
    description: Consultas al tutor IA con RAG por curso/tenant (H5). Procesamiento asíncrono vía SQS.
paths:
  /courses:
    post:
      tags: [Cursos]
      summary: Crear curso
      description: Crea un curso en el tenant del docente autenticado (H1). Rol requerido `docente` o `admin_colegio`.
      operationId: createCourse
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
            examples:
              matematicas:
                value: { name: "Matemáticas 7° Básico A", period: "2026-S2", subject: "Matemática", grade_level: "7B" }
      responses:
        '201':
          description: Curso creado.
          headers:
            Location:
              description: URL del curso creado.
              schema: { type: string }
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Cursos]
      summary: Listar cursos
      description: Lista los cursos del tenant visibles para el usuario (docente ve los suyos, estudiante los matriculados). Paginación por cursor.
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: period
          in: query
          required: false
          description: Filtra por periodo académico.
          schema: { type: string, example: "2026-S2" }
      responses:
        '200':
          description: Página de cursos.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}:
    get:
      tags: [Cursos]
      summary: Obtener curso
      description: Devuelve un curso del tenant del usuario. Si pertenece a otro colegio responde 404.
      operationId: getCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/enrollments:
    post:
      tags: [Cursos]
      summary: Matricular estudiante
      description: Matricula a un estudiante del mismo tenant por su correo institucional (H1). Si el estudiante pertenece a otro colegio, responde 404.
      operationId: enrollStudent
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentInput'
      responses:
        '201':
          description: Estudiante matriculado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /courses/{courseId}/assessments:
    post:
      tags: [Evaluaciones]
      summary: Crear evaluación
      description: Crea una evaluación de alternativas en estado `draft` con retroalimentación por pregunta (H2).
      operationId: createAssessment
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentInput'
      responses:
        '201':
          description: Evaluación creada en borrador.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assessments/{assessmentId}:
    patch:
      tags: [Evaluaciones]
      summary: Publicar o cerrar evaluación
      description: Cambia el estado de la evaluación (H2). No se puede publicar si alguna pregunta no tiene respuesta correcta (422).
      operationId: updateAssessmentStatus
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentStatusInput'
      responses:
        '200':
          description: Evaluación actualizada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assessments/{assessmentId}/submissions:
    post:
      tags: [Evaluaciones]
      summary: Rendir evaluación
      description: |
        El estudiante envía sus respuestas y recibe puntaje y retroalimentación al instante (H4).
        Requiere estar matriculado (si no, 404). Un segundo envío responde 409 con el resultado anterior
        en `detail`. Reintentar con la misma `Idempotency-Key` devuelve la misma respuesta sin duplicar.
      operationId: submitAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      responses:
        '201':
          description: Respuestas registradas y corregidas.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /assessments/{assessmentId}/results:
    get:
      tags: [Resultados]
      summary: Dashboard de resultados
      description: Resultados agregados de la evaluación para el docente (H3). Sin respuestas devuelve `submissions_count = 0` y listas vacías (no error).
      operationId: getAssessmentResults
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - name: student_id
          in: query
          required: false
          description: Filtra el detalle por estudiante.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resultados agregados.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/tutor-questions:
    post:
      tags: [Tutor IA]
      summary: Preguntar al tutor IA
      description: |
        Encola una pregunta al tutor IA del curso (H5). Se procesa de forma asíncrona (SQS + worker, ADR 0003).
        Responde 202 con la URL para consultar el estado. Solo se usan como fuente los apuntes del curso y tenant del estudiante.
      operationId: askTutor
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorQuestionInput'
      responses:
        '202':
          description: Pregunta aceptada y encolada.
          headers:
            Location:
              description: URL para consultar la respuesta.
              schema: { type: string }
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tutor-questions/{questionId}:
    get:
      tags: [Tutor IA]
      summary: Consultar respuesta del tutor IA
      description: Devuelve el estado y, cuando está lista, la respuesta con sus fuentes. Si no hay contenido de respaldo, `grounded = false` y el tutor indica que no tiene información suficiente.
      operationId: getTutorQuestion
      parameters:
        - name: questionId
          in: path
          required: true
          description: Identificador de la pregunta.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado de la pregunta.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido tras el login institucional (SSO/OAuth2). Incluye `sub`, `tenant_id` y `role` (`docente`, `estudiante`, `admin_colegio`).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente. Misma clave en 24 h = misma respuesta, sin duplicar.
      schema: { type: string, format: uuid }
    CourseId:
      name: courseId
      in: path
      required: true
      description: Identificador del curso.
      schema: { type: string, format: uuid }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      description: Identificador de la evaluación.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto en `next_cursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    X-Trace-Id:
      description: Identificador de traza para correlacionar logs (CloudWatch).
      schema: { type: string }
    X-RateLimit-Remaining:
      description: Solicitudes restantes en la ventana para el tenant.
      schema: { type: integer }
    Retry-After:
      description: Segundos a esperar antes de reintentar.
      schema: { type: integer }
  schemas:
    Problem:
      type: object
      description: Error RFC 7807.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: "https://api.aulaviva.example/errors/validation" }
        title: { type: string, example: "Datos inválidos" }
        status: { type: integer, example: 422 }
        detail: { type: string, example: "La pregunta 2 no tiene respuesta correcta." }
        instance: { type: string, example: "/v1/assessments/5f0c.../" }
        trace_id: { type: string, example: "c8f2b1d4e7" }
        errors:
          type: array
          description: Detalle por campo (solo en 422).
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: "questions[1].correct_option" }
              message: { type: string, example: "Requerido para publicar." }
    CourseInput:
      type: object
      required: [name, period]
      properties:
        name: { type: string, minLength: 3, maxLength: 120, example: "Matemáticas 7° Básico A" }
        period: { type: string, pattern: '^\d{4}-S[12]$', example: "2026-S2" }
        subject: { type: string, maxLength: 80, example: "Matemática" }
        grade_level: { type: string, maxLength: 10, example: "7B" }
    Course:
      allOf:
        - $ref: '#/components/schemas/CourseInput'
        - type: object
          required: [id, teacher_id, created_at]
          properties:
            id: { type: string, format: uuid }
            teacher_id: { type: string, format: uuid }
            students_count: { type: integer, minimum: 0 }
            created_at: { type: string, format: date-time }
    CoursePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Course' }
        next_cursor:
          type: [string, 'null']
          description: Cursor de la siguiente página; null si no hay más.
    EnrollmentInput:
      type: object
      required: [student_email]
      properties:
        student_email: { type: string, format: email, example: "estudiante.demo@colegio-demo.cl" }
    Enrollment:
      type: object
      required: [id, course_id, student_id, enrolled_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        enrolled_at: { type: string, format: date-time }
    QuestionInput:
      type: object
      required: [statement, options]
      properties:
        statement: { type: string, minLength: 3, example: "¿Cuánto es 3/4 + 1/4?" }
        options:
          type: array
          minItems: 2
          maxItems: 6
          items: { type: string }
          example: ["1/2", "1", "4/8", "3/16"]
        correct_option:
          type: [integer, 'null']
          minimum: 0
          description: Índice de la alternativa correcta. Obligatorio para publicar.
          example: 1
        feedback:
          type: string
          description: Retroalimentación que ve el estudiante tras responder.
          example: "Suma los numeradores con igual denominador: 4/4 = 1."
    AssessmentInput:
      type: object
      required: [title, questions]
      properties:
        title: { type: string, minLength: 3, maxLength: 150, example: "Prueba de fracciones" }
        max_attempts: { type: integer, minimum: 1, maximum: 1, default: 1, description: "MVP: un intento." }
        questions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QuestionInput' }
    Assessment:
      type: object
      required: [id, course_id, title, status, questions]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [draft, published, closed] }
        max_attempts: { type: integer }
        questions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuestionInput'
              - type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        published_at: { type: [string, 'null'], format: date-time }
    AssessmentStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [published, closed] }
    SubmissionInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [question_id, selected_option]
            properties:
              question_id: { type: string, format: uuid }
              selected_option: { type: integer, minimum: 0 }
    SubmissionResult:
      type: object
      required: [id, assessment_id, score, max_score, answers, submitted_at]
      properties:
        id: { type: string, format: uuid }
        assessment_id: { type: string, format: uuid }
        score: { type: integer, minimum: 0, example: 8 }
        max_score: { type: integer, minimum: 1, example: 10 }
        answers:
          type: array
          items:
            type: object
            required: [question_id, correct, feedback]
            properties:
              question_id: { type: string, format: uuid }
              correct: { type: boolean }
              feedback: { type: string }
        submitted_at: { type: string, format: date-time }
    AssessmentResults:
      type: object
      required: [assessment_id, submissions_count, average_score, questions]
      properties:
        assessment_id: { type: string, format: uuid }
        submissions_count: { type: integer, minimum: 0 }
        average_score: { type: [number, 'null'], description: "null si no hay respuestas." }
        questions:
          type: array
          description: Porcentaje de aciertos por pregunta.
          items:
            type: object
            required: [question_id, correct_rate]
            properties:
              question_id: { type: string, format: uuid }
              correct_rate: { type: number, minimum: 0, maximum: 1 }
        students:
          type: array
          description: Detalle por estudiante (o solo uno si se filtra por `student_id`).
          items:
            type: object
            required: [student_id, score]
            properties:
              student_id: { type: string, format: uuid }
              score: { type: integer }
              submitted_at: { type: string, format: date-time }
    TutorQuestionInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 1000, example: "¿Por qué 3/4 + 1/4 da 1?" }
    TutorQuestion:
      type: object
      required: [id, course_id, status, question, created_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, answered, failed] }
        question: { type: string }
        answer: { type: [string, 'null'] }
        grounded:
          type: [boolean, 'null']
          description: true si la respuesta se basa en apuntes del curso; false si no hubo contenido de respaldo.
        sources:
          type: array
          description: Apuntes del curso usados como fuente (siempre del mismo tenant).
          items:
            type: object
            required: [note_id, title]
            properties:
              note_id: { type: string, format: uuid }
              title: { type: string }
        created_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
  responses:
    BadRequest:
      description: Solicitud mal formada (por ejemplo, falta Idempotency-Key).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Token ausente o inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: El rol del usuario no permite la operación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe en el tenant del usuario (también si pertenece a otro colegio).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicto de estado (ya matriculado, evaluación ya rendida).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Datos inválidos según reglas de negocio.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.aulaviva.example/errors/validation"
            title: "Datos inválidos"
            status: 422
            detail: "No se puede publicar: la pregunta 2 no tiene respuesta correcta."
            instance: "/v1/assessments/3b1f7c1e-2a4d-4c1b-9d7e-0c5a1e2f3a4b"
            trace_id: "c8f2b1d4e7"
            errors:
              - field: "questions[1].correct_option"
                message: "Requerido para publicar."
    RateLimited:
      description: Límite de solicitudes por tenant excedido (FinOps del LLM y protección en picos).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
