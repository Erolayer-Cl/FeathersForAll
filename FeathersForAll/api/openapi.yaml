        '200':
          description: Material del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMaterialList'
              example:
                data:
                  - { name: "guia-fracciones.pdf", content_type: "application/pdf", size_bytes: 482113, original: true, uploaded_at: "2026-11-20T14:02:11Z" }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/materials/{materialName}/file:
    get:
      tags: [Contenido]
      summary: Descargar un material del curso
      description: |
        Descarga el archivo como adjunto (`Content-Disposition: attachment`, `X-Content-Type-Options: nosniff`,
        `Content-Security-Policy: sandbox`): el navegador no lo interpreta. Mismo acceso que `listCourseMaterials`.
      operationId: downloadCourseMaterial
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/MaterialName'
      responses:
        '200':
          description: El archivo, como adjunto (`Content-Disposition` con `filename` y `filename*` en UTF-8).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/tasks:
    get:
      tags: [Contenido]
      summary: Tareas del curso
      description: |
        Tareas del curso, de la que cierra antes a la que cierra después. `is_open` dice si todavía se puede entregar.
        El estudiante recibe `my_submission` (su entrega o `null`); el docente y el admin reciben
        `submissions_count` y `students_count`.
      operationId: listCourseTasks
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Tareas del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Contenido]
      summary: Crear una tarea con hora límite
      description: |
        El docente del curso (o el admin) publica una tarea con fecha y hora límite. La hora va en ISO 8601 **con zona
        horaria** (por ejemplo `-03:00` para Chile), debe ser futura y estar a menos de 366 días. Hasta esa hora cada
        estudiante puede subir un archivo (y reemplazarlo); después, la API y la base rechazan las entregas.
        El archivo del enunciado, si hay, se sube después con `putTaskAttachment`.
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
            example: { title: "Guía de fracciones", instructions: "Resuelve los ejercicios 1 al 5 y sube una foto o un PDF.", due_at: "2026-12-04T23:59:00-03:00" }
      responses:
        '201':
          description: Tarea creada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}:
    get:
      tags: [Contenido]
      summary: Una tarea
      description: |
        La tarea. Para el docente y el admin incluye `students`: todos los estudiantes con matrícula activa, con su
        entrega o `null` (así se ve quién no entregó).
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: La tarea.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Contenido]
      summary: Editar una tarea
      description: |
        Cambia el título, las instrucciones (`null` las quita) o la hora límite. Mover la hora al futuro reabre la tarea;
        moverla al pasado la cierra de inmediato. Solo el docente del curso o el admin.
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
            example: { due_at: "2026-12-06T23:59:00-03:00" }
      responses:
        '200':
          description: Tarea actualizada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Contenido]
      summary: Borrar una tarea
      description: Borra la tarea, su archivo y **todas las entregas**. Solo el docente del curso o el admin.
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Tarea borrada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/attachment:
    get:
      tags: [Contenido]
      summary: Descargar el archivo de la tarea
      description: El enunciado o guía que adjuntó el docente. Cualquiera que participe en el curso.
      operationId: downloadTaskAttachment
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: El archivo, como adjunto (`Content-Disposition` con `filename` y `filename*` en UTF-8).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Contenido]
      summary: Quitar el archivo de la tarea
      description: Quita el enunciado adjunto; la tarea y las entregas siguen. Solo el docente del curso o el admin.
      operationId: deleteTaskAttachment
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Archivo quitado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/attachment/{fileName}:
    put:
      tags: [Contenido]
      summary: Adjuntar (o reemplazar) el archivo de la tarea
      description: |
        Cuerpo binario de hasta 10 MB. Formatos: `.pdf`, `.doc(x)`, `.ppt(x)`, `.xls(x)`, `.odt`, `.odp`, `.ods`, `.txt`,
        `.md`, `.jpg`, `.jpeg`, `.png`, `.zip`. El tipo lo decide el servidor por la extensión y revisa que el contenido
        calce (`422 invalid-file` si no). Solo el docente del curso o el admin.
      operationId: putTaskAttachment
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/FileName'
      requestBody:
        $ref: '#/components/requestBodies/BinaryFile'
      responses:
        '200':
          description: Archivo guardado; devuelve la tarea.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}/submission:
    get:
      tags: [Contenido]
      summary: Descargar mi entrega
      description: El estudiante descarga lo que entregó. El docente usa `downloadTaskSubmission`.
      operationId: downloadMyTaskSubmission
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: El archivo, como adjunto (`Content-Disposition` con `filename` y `filename*` en UTF-8).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/submission/{fileName}:
    put:
      tags: [Contenido]
      summary: Entregar (o reemplazar) mi archivo
      description: |
        El estudiante matriculado sube su archivo (mismos formatos y tope que el archivo de la tarea). Una entrega por
        estudiante: subir otra vez la reemplaza (`200`) mientras la tarea siga abierta. Pasada la hora límite responde
        `409` (`task-closed`) y no guarda nada; la base de datos aplica la misma regla (RLS), así que una subida que
        termina después de la hora también se rechaza. La hora de la entrega la pone el servidor.
      operationId: putTaskSubmission
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/FileName'
      requestBody:
        $ref: '#/components/requestBodies/BinaryFile'
      responses:
        '200':
          description: Entrega reemplazada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmission'
        '201':
          description: Primera entrega.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmission'
              example: { file_name: "guia-camila.pdf", size_bytes: 230411, submitted_at: "2026-12-03T21:14:05Z" }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TaskClosed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}/submissions/{studentId}/file:
    get:
      tags: [Contenido]
      summary: Descargar la entrega de un estudiante
      description: Solo el docente del curso o el admin.
      operationId: downloadTaskSubmission
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: El archivo, como adjunto (`Content-Disposition` con `filename` y `filename*` en UTF-8).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 emitido por `POST /auth/login` (ADR 0007; el SSO institucional queda como evolución). Incluye `sub`, `tenant_id` y `role` (`docente`, `estudiante`, `admin_colegio`).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente. Misma clave en 24 h = misma respuesta, sin duplicar.
      schema: { type: string, format: uuid }
    CourseId:
      name: courseId
      in: path
      required: true
      description: Identificador del curso.
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Identificador de la conversación con el tutor (UUID que genera el cliente).
      schema: { type: string, format: uuid }
    DocumentName:
      name: documentName
      in: path
      required: true
      description: Nombre del apunte en el curso, con su extensión (por ejemplo `fracciones.pdf`). Codificado con encodeURIComponent.
      schema: { type: string, minLength: 1, maxLength: 120 }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Identificador de la tarea.
      schema: { type: string, format: uuid }
    StudentId:
      name: studentId
      in: path
      required: true
      description: Identificador del estudiante.
      schema: { type: string, format: uuid }
    MaterialName:
      name: materialName
      in: path
      required: true
      description: Nombre del material en el curso (el mismo de `listCourseMaterials`). Codificado con encodeURIComponent.
      schema: { type: string, minLength: 1, maxLength: 150 }
    FileName:
      name: fileName
      in: path
      required: true
      description: |
        Nombre del archivo con su extensión, codificado con encodeURIComponent. Sin `/ \ : * ? " < > |` ni saltos de línea.
      schema: { type: string, minLength: 1, maxLength: 150 }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      description: Identificador de la evaluación.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto en `next_cursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    X-Trace-Id:
      description: Identificador de traza para correlacionar logs (CloudWatch).
      schema: { type: string }
    X-RateLimit-Remaining:
      description: Solicitudes restantes en la ventana para el tenant.
      schema: { type: integer }
    Retry-After:
      description: Segundos a esperar antes de reintentar.
      schema: { type: integer }
  schemas:
    Problem:
      type: object
      description: Error RFC 7807.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: "https://api.feathersforall.example/errors/validation" }
        title: { type: string, example: "Datos inválidos" }
        status: { type: integer, example: 422 }
        detail: { type: string, example: "La pregunta 2 no tiene respuesta correcta." }
        instance: { type: string, example: "/v1/assessments/5f0c.../" }
        trace_id: { type: string, example: "c8f2b1d4e7" }
        errors:
          type: array
          description: Detalle por campo (solo en 422).
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: "questions[1].correct_option" }
              message: { type: string, example: "Requerido para publicar." }
    CourseInput:
      type: object
      required: [name, period]
      properties:
        name: { type: string, minLength: 3, maxLength: 120, example: "Matemáticas 7° Básico A" }
        period: { type: string, pattern: '^\d{4}-S[12]$', example: "2026-S2" }
        subject: { type: string, maxLength: 80, example: "Matemática" }
        grade_level: { type: string, maxLength: 10, example: "7B" }
        teacher_id:
          type: string
          format: uuid
          description: Docente que dicta el curso. Solo lo indica el administrador (obligatorio para él); un docente crea cursos a su nombre.
    Course:
      allOf:
        - $ref: '#/components/schemas/CourseInput'
        - type: object
          required: [id, teacher_id, created_at]
          properties:
            id: { type: string, format: uuid }
            teacher_id: { type: string, format: uuid }
            teacher_name: { type: string, example: "Ana Rojas" }
            students_count: { type: integer, minimum: 0, description: "Estudiantes con matrícula activa. Solo para docente y admin." }
            tutor_available: { type: boolean, description: "El tutor IA tiene apuntes indexados de este curso." }
            tutor_documents: { type: integer, minimum: 0, description: "Apuntes que el docente subió al tutor." }
            created_at: { type: string, format: date-time }
    CoursePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Course' }
        next_cursor:
          type: [string, 'null']
          description: Cursor de la siguiente página; null si no hay más.
    LoginInput:
      type: object
      required: [rbd, email, password]
      properties:
        rbd: { type: string, minLength: 1, maxLength: 20, description: "RBD del colegio.", example: "99901" }
        email: { type: string, format: email, maxLength: 150, example: "camila@demo-a.cl" }
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    School:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Colegio Demo A" }
        rbd: { type: [string, 'null'], example: "99901" }
    Me:
      type: object
      required: [id, name, email, role, school]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Camila Díaz" }
        email: { type: string, format: email }
        role: { type: string, enum: [estudiante, docente, admin_colegio] }
        school: { $ref: '#/components/schemas/School' }
    Session:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, description: "JWT HS256 con sub, tenant_id y role." }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: "Segundos de validez del token.", example: 28800 }
        user: { $ref: '#/components/schemas/Me' }
    GradeEntry:
      type: object
      required: [assessment_id, title, grade]
      properties:
        assessment_id: { type: string, format: uuid }
        title: { type: string, example: "Fracciones" }
        score: { type: number, minimum: 0, maximum: 100, description: "Puntaje en % de logro." }
        grade: { type: number, minimum: 1, maximum: 7, description: "Nota 1,0–7,0 (se calcula con el puntaje y la exigencia)." }
        weight: { type: number, exclusiveMinimum: 0, description: "Ponderación de la evaluación en el promedio." }
        submitted_at: { type: string, format: date-time }
    MyCourseGrades:
      type: object
      required: [course_id, course, grades]
      properties:
        course_id: { type: string, format: uuid }
        course: { type: string, example: "Matemáticas 7° Básico A" }
        subject: { type: [string, 'null'], example: "Matemática" }
        period: { type: string, example: "2026-S2" }
        teacher_name: { type: string, example: "Ana Rojas" }
        tutor_available: { type: boolean }
        average: { type: [number, 'null'], description: "Promedio ponderado del ramo; null si aún no hay notas." }
        grades:
          type: array
          items: { $ref: '#/components/schemas/GradeEntry' }
    MyGrades:
      type: object
      required: [student_id, courses]
      properties:
        student_id: { type: string, format: uuid }
        courses:
          type: array
          items: { $ref: '#/components/schemas/MyCourseGrades' }
    StudentCourseGrades:
      type: object
      required: [course_id, course, student_id, grades]
      properties:
        course_id: { type: string, format: uuid }
        course: { type: string }
        student_id: { type: string, format: uuid }
        average: { type: [number, 'null'], description: "Promedio ponderado; null si aún no hay notas." }
        grades:
          type: array
          items: { $ref: '#/components/schemas/GradeEntry' }
    Gradebook:
      type: object
      required: [course_id, course, assessments, students]
      properties:
        course_id: { type: string, format: uuid }
        course: { type: string }
        assessments:
          type: array
          items:
            type: object
            required: [id, title, status]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string, enum: [borrador, publicada, cerrada] }
              pass_threshold: { type: number, description: "% de logro que equivale al 4,0." }
              weight: { type: number }
              published_at: { type: [string, 'null'], format: date-time }
        students:
          type: array
          items:
            type: object
            required: [student_id, name, grades]
            properties:
              student_id: { type: string, format: uuid }
              name: { type: string }
              average: { type: [number, 'null'] }
              grades:
                type: object
                description: "Nota por id de evaluación (null si no la rindió)."
                additionalProperties: { type: [number, 'null'] }
        course_average: { type: [number, 'null'], description: "Promedio simple de los promedios de los estudiantes." }
    GradesSummary:
      type: object
      required: [course_id, course, enrolled_students, assessments, at_risk_threshold, at_risk]
      properties:
        course_id: { type: string, format: uuid }
        course: { type: string }
        enrolled_students: { type: integer, minimum: 0 }
        assessments:
          type: array
          items:
            type: object
            required: [assessment_id, title, status, submissions, pending]
            properties:
              assessment_id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string, enum: [borrador, publicada, cerrada] }
              submissions: { type: integer, minimum: 0 }
              pending: { type: integer, minimum: 0, description: "Matriculados que aún no entregan." }
              average: { type: [number, 'null'] }
              min: { type: [number, 'null'] }
              max: { type: [number, 'null'] }
              passed: { type: [integer, 'null'] }
              failed: { type: [integer, 'null'] }
        at_risk_threshold: { type: number }
        at_risk:
          type: array
          items:
            type: object
            required: [student_id, name, average]
            properties:
              student_id: { type: string, format: uuid }
              name: { type: string }
              average: { type: number }
              assessments_taken: { type: integer, minimum: 0 }
    GradingInput:
      type: object
      minProperties: 1
      properties:
        pass_threshold: { type: number, minimum: 1, maximum: 99, description: "% de logro que equivale al 4,0 (por defecto 60)." }
        weight: { type: number, exclusiveMinimum: 0, maximum: 999, description: "Peso de la evaluación en el promedio." }
    GradingResult:
      type: object
      required: [assessment_id, title, pass_threshold, weight]
      properties:
        assessment_id: { type: string, format: uuid }
        title: { type: string }
        pass_threshold: { type: number }
        weight: { type: number }
    GradeDetail:
      allOf:
        - $ref: '#/components/schemas/GradeEntry'
        - type: object
          required: [answers]
          properties:
            pass_threshold: { type: number, description: "Exigencia: % de logro para el 4,0." }
            answers:
              type: array
              items:
                type: object
                required: [order, question, correct]
                properties:
                  order: { type: integer, minimum: 1 }
                  question: { type: string }
                  type: { type: string, enum: [multiple_choice, text], description: "v1.10." }
                  selected_option: { type: [string, 'null'], description: "Texto de la alternativa elegida o, si la pregunta es de texto, lo que escribió." }
                  correct: { type: boolean }
                  pending_review: { type: boolean, description: "v1.11. Por revisar del docente." }
                  feedback: { type: [string, 'null'] }
            pending_review: { type: integer, minimum: 0, description: "v1.11. Si es mayor que 0, la nota es provisional." }
    EnrollmentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, student_id, name, email, enrolled_at]
            properties:
              id: { type: string, format: uuid, description: "Id de la matrícula." }
              student_id: { type: string, format: uuid }
              name: { type: string, example: "Camila Díaz" }
              email: { type: string, format: email }
              enrolled_at: { type: string, format: date-time }
    AssessmentSummaryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, title, status, questions_count]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string, enum: [draft, published, closed] }
              questions_count: { type: integer, minimum: 0 }
              published_at: { type: [string, 'null'], format: date-time }
              closes_at: { type: [string, 'null'], format: date-time }
              submissions_count: { type: integer, minimum: 0, description: "Estudiantes que entregaron. Solo para docente y admin." }
              submitted: { type: boolean, description: "El estudiante ya la rindió. Solo para el estudiante." }
              grade: { type: [number, 'null'], minimum: 1, maximum: 7, description: "Su nota. Solo para el estudiante." }
              score: { type: [number, 'null'], description: "Su porcentaje de logro. Solo para el estudiante." }
              submitted_at: { type: [string, 'null'], format: date-time, description: "Cuándo la entregó. Solo para el estudiante." }
    EnrollmentInput:
      type: object
      required: [student_email]
      properties:
        student_email: { type: string, format: email, example: "estudiante.demo@colegio-demo.cl" }
    Enrollment:
      type: object
      required: [id, course_id, student_id, enrolled_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        enrolled_at: { type: string, format: date-time }
    QuestionInput:
      type: object
      required: [statement]
      description: |
        Pregunta de alternativas (`type: multiple_choice`, el valor por defecto: `options` de 2 a 6 y `correct_option`)
        o de respuesta escrita (`type: text`, v1.10: sin `options` y con `accepted_answers`).
      properties:
        type: { type: string, enum: [multiple_choice, text], default: multiple_choice }
        statement: { type: string, minLength: 3, example: "¿Cuánto es 3/4 + 1/4?" }
        options:
          type: array
          maxItems: 6
          items: { type: string }
          description: De 2 a 6 en las preguntas de alternativas; vacío (o ausente) en las de texto.
          example: ["1/2", "1", "4/8", "3/16"]
        correct_option:
          type: [integer, 'null']
          minimum: 0
          description: Índice de la alternativa correcta. Obligatorio para publicar (solo alternativas).
          example: 1
        accepted_answers:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 300 }
          description: |
            Solo preguntas de texto: respuestas que se dan por correctas (de 0 a 10). Sin ninguna, el docente revisa
            cada respuesta a mano (v1.11). Solo las ve el docente o el admin.
          example: ["1", "uno", "4/4"]
        feedback:
          type: string
          description: Retroalimentación que ve el estudiante tras responder.
          example: "Suma los numeradores con igual denominador: 4/4 = 1."
    AssessmentInput:
      type: object
      required: [title, questions]
      properties:
        closes_at: { type: [string, 'null'], format: date-time, description: "Cierre automático (futuro). Sin fecha, la evaluación se cierra a mano." }
        title: { type: string, minLength: 3, maxLength: 150, example: "Prueba de fracciones" }
        max_attempts: { type: integer, minimum: 1, maximum: 1, default: 1, description: "MVP: un intento." }
        questions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QuestionInput' }
    Assessment:
      type: object
      required: [id, course_id, title, status, questions]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [draft, published, closed] }
        max_attempts: { type: integer }
        questions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuestionInput'
              - type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        published_at: { type: [string, 'null'], format: date-time }
        closes_at: { type: [string, 'null'], format: date-time }
    GenerateAssessmentInput:
      type: object
      required: [topic]
      properties:
        topic: { type: string, minLength: 3, maxLength: 200, example: "Fracciones: suma con igual denominador" }
        questions_count: { type: integer, minimum: 1, maximum: 10, default: 5 }
        options_count: { type: integer, minimum: 2, maximum: 5, default: 4, description: "Alternativas por pregunta." }
        use_notes: { type: boolean, default: true, description: "Basar las preguntas en los apuntes del curso." }
    GeneratedAssessment:
      type: object
      required: [title, questions, source]
      properties:
        title: { type: string }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuestionInput' }
        source: { type: string, enum: [apuntes, tema], description: "De dónde salieron las preguntas." }
        sources: { type: array, items: { type: string }, description: "Apuntes usados (nombres de documento)." }
        requested_questions: { type: integer, description: "Cuántas se pidieron; pueden llegar menos si el modelo falló en alguna." }
    AssessmentStatusInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        status: { type: string, enum: [published, closed] }
        closes_at:
          type: [string, 'null']
          format: date-time
          description: "v1.9. Hora de cierre (futura, con zona horaria, a menos de 366 días) o null = sin cierre automático."
      example: { status: published, closes_at: "2026-11-26T15:30:00-03:00" }
    SubmissionInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [question_id]
            description: "`selected_option` para las preguntas de alternativas; `text_answer` para las de texto (v1.10)."
            properties:
              question_id: { type: string, format: uuid }
              selected_option: { type: integer, minimum: 0 }
              text_answer: { type: string, maxLength: 1000, description: "Respuesta escrita. En blanco cuenta como sin responder." }
    SubmissionResult:
      type: object
      required: [id, assessment_id, score, max_score, answers, submitted_at]
      properties:
        percentage: { type: [number, 'null'], minimum: 0, maximum: 100, description: "Porcentaje de logro (0–100).", example: 50 }
        grade: { type: [number, 'null'], minimum: 1, maximum: 7, description: "Nota en escala chilena 1,0–7,0, según la exigencia de la evaluación.", example: 3.5 }
        id: { type: string, format: uuid }
        assessment_id: { type: string, format: uuid }
        score: { type: integer, minimum: 0, example: 8 }
        max_score: { type: integer, minimum: 1, example: 10 }
        answers:
          type: array
          items:
            type: object
            required: [question_id, correct, feedback]
            properties:
              question_id: { type: string, format: uuid }
              correct: { type: boolean }
              pending_review: { type: boolean, description: "v1.11. Respuesta escrita que el docente aún debe revisar (vale 0 por ahora)." }
              feedback: { type: string }
        pending_review: { type: integer, minimum: 0, description: "v1.11. Respuestas por revisar: si es mayor que 0, la nota es provisional." }
        submitted_at: { type: string, format: date-time }
    TextAnswer:
      type: object
      required: [id, question_id, question_order, question, student_id, student_name, text_answer, correct, pending_review]
      properties:
        id: { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        question_order: { type: integer, minimum: 1 }
        question: { type: string }
        accepted_answers: { type: array, items: { type: string }, description: "Vacío si la pregunta es de revisión manual." }
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        text_answer: { type: string }
        correct: { type: boolean }
        pending_review: { type: boolean }
        reviewed_at: { type: [string, 'null'], format: date-time }
        submitted_at: { type: string, format: date-time }
    TextAnswerList:
      type: object
      required: [pending, data]
      properties:
        pending: { type: integer, minimum: 0 }
        data:
          type: array
          items: { $ref: '#/components/schemas/TextAnswer' }
    TextAnswerReview:
      type: object
      required: [correct]
      additionalProperties: false
      properties:
        correct: { type: boolean }
    TextAnswerReviewResult:
      type: object
      required: [id, correct, pending_review, reviewed_at, student_percentage, student_grade]
      properties:
        id: { type: string, format: uuid }
        correct: { type: boolean }
        pending_review: { type: boolean }
        reviewed_at: { type: string, format: date-time }
        student_percentage: { type: number, minimum: 0, maximum: 100 }
        student_grade: { type: number, minimum: 1, maximum: 7 }
    AssessmentResults:
      type: object
      required: [assessment_id, submissions_count, average_score, questions]
      properties:
        assessment_id: { type: string, format: uuid }
        submissions_count: { type: integer, minimum: 0 }
        average_score: { type: [number, 'null'], description: "null si no hay respuestas." }
        questions:
          type: array
          description: Porcentaje de aciertos por pregunta.
          items:
            type: object
            required: [question_id, correct_rate]
            properties:
              question_id: { type: string, format: uuid }
              correct_rate: { type: number, minimum: 0, maximum: 1 }
        students:
          type: array
          description: Detalle por estudiante (o solo uno si se filtra por `student_id`).
          items:
            type: object
            required: [student_id, score]
            properties:
              student_id: { type: string, format: uuid }
              score: { type: integer }
              submitted_at: { type: string, format: date-time }
    TutorQuestionInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 1000, example: "¿Por qué 3/4 + 1/4 da 1?" }
    TutorQuestion:
      type: object
      required: [id, course_id, status, question, created_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, answered, failed] }
        question: { type: string }
        answer: { type: [string, 'null'] }
        grounded:
          type: [boolean, 'null']
          description: true si la respuesta se basa en apuntes del curso; false si no hubo contenido de respaldo.
        sources:
          type: array
          description: Apuntes del curso usados como fuente (siempre del mismo tenant).
          items:
            type: object
            required: [note_id, title]
            properties:
              note_id: { type: string, format: uuid }
              title: { type: string }
        created_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
    TutorSource:
      type: object
      required: [doc_id, score]
      properties:
        doc_id: { type: string, description: "Apunte del curso usado como fuente.", example: "fracciones.md" }
        score: { type: number, minimum: 0, maximum: 1, description: "Similitud del fragmento con la pregunta.", example: 0.82 }
    TutorMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000, example: "¿Qué indica el denominador de una fracción?" }
        mode:
          type: string
          enum: [tutor, pruebas]
          default: tutor
          description: "Solo al crear la conversación: `tutor` (estudiar) o `pruebas` (practicar una prueba)."
    TutorConversation:
      type: object
      required: [id, course_id, mode, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        mode: { type: string, enum: [tutor, pruebas] }
        title: { type: string, maxLength: 60, description: "Inicio de la primera pregunta.", example: "¿Qué indica el denominador de una fracción?" }
        messages_count: { type: integer, minimum: 0, description: "Solo en la lista." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: "Último mensaje. La retención se cuenta desde aquí." }
    TutorConversationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TutorConversation' }
    TutorMessage:
      type: object
      required: [role, content, sources, created_at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        sources:
          type: array
          description: Apuntes usados en la respuesta (vacío en las preguntas y en la charla).
          items: { $ref: '#/components/schemas/TutorSource' }
        created_at: { type: string, format: date-time }
    TutorConversationDetail:
      allOf:
        - $ref: '#/components/schemas/TutorConversation'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/TutorMessage' }
    CourseDocument:
      type: object
      required: [name, chunks, official]
      properties:
        name: { type: string, example: "fracciones.pdf", description: "Nombre del apunte; identifica al documento dentro del curso." }
        chunks: { type: integer, minimum: 0, description: "Fragmentos indexados que el tutor puede citar." }
        official: { type: boolean, description: "Bases Curriculares del Mineduc (true) o apunte del docente (false)." }
        pages: { type: integer, minimum: 1, description: "Solo al subir un PDF: páginas leídas." }
    CourseDocumentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CourseDocument' }
    CourseMaterial:
      type: object
      required: [name, content_type, size_bytes, original, uploaded_at]
      properties:
        name: { type: string, example: "guia-fracciones.pdf" }
        content_type: { type: string, example: "application/pdf" }
        size_bytes: { type: integer, minimum: 0 }
        original: { type: boolean, description: "true = se descarga el archivo tal como se subió; false = su texto como .txt." }
        uploaded_at: { type: string, format: date-time }
    CourseMaterialList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CourseMaterial' }
    TaskInput:
      type: object
      required: [title, due_at]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 3, maxLength: 150 }
        instructions: { type: [string, 'null'], maxLength: 4000 }
        due_at: { type: string, format: date-time, description: "Fecha y hora límite, con zona horaria. Futura y a menos de 366 días." }
    TaskPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: string, minLength: 3, maxLength: 150 }
        instructions: { type: [string, 'null'], maxLength: 4000 }
        due_at: { type: string, format: date-time, description: "Al futuro reabre la tarea; al pasado la cierra." }
    TaskFile:
      type: object
      required: [name, size_bytes, content_type]
      properties:
        name: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        content_type: { type: string }
    TaskSubmission:
      type: object
      required: [file_name, size_bytes, submitted_at]
      properties:
        file_name: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        submitted_at: { type: string, format: date-time, description: "Hora de la última entrega, puesta por el servidor." }
    Task:
      type: object
      required: [id, course_id, title, instructions, due_at, is_open, attachment, created_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        title: { type: string }
        instructions: { type: [string, 'null'] }
        due_at: { type: string, format: date-time }
        is_open: { type: boolean, description: "true mientras no pase la hora límite (calculado por el servidor)." }
        attachment:
          oneOf:
            - $ref: '#/components/schemas/TaskFile'
            - type: 'null'
        created_at: { type: string, format: date-time }
        my_submission:
          description: Solo para el estudiante. Su entrega, o null si no ha entregado.
          oneOf:
            - $ref: '#/components/schemas/TaskSubmission'
            - type: 'null'
        submissions_count: { type: integer, minimum: 0, description: "Solo para el docente y el admin." }
        students_count: { type: integer, minimum: 0, description: "Solo para el docente y el admin: matrículas activas." }
    TaskStudent:
      type: object
      required: [student_id, name, submission]
      properties:
        student_id: { type: string, format: uuid }
        name: { type: string }
        submission:
          oneOf:
            - $ref: '#/components/schemas/TaskSubmission'
            - type: 'null'
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            students:
              type: array
              description: Solo para el docente y el admin. Todos los estudiantes con matrícula activa.
              items: { $ref: '#/components/schemas/TaskStudent' }
    TaskList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
  requestBodies:
    BinaryFile:
      required: true
      description: El archivo como cuerpo binario (no multipart). El Content-Type es informativo; manda la extensión.
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
  responses:
    BadRequest:
      description: Solicitud mal formada (por ejemplo, falta Idempotency-Key).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Token ausente o inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: El rol del usuario no permite la operación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe en el tenant del usuario (también si pertenece a otro colegio).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicto de estado (ya matriculado, evaluación ya rendida).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Datos inválidos según reglas de negocio.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.feathersforall.example/errors/validation"
            title: "Datos inválidos"
            status: 422
            detail: "No se puede publicar: la pregunta 2 no tiene respuesta correcta."
            instance: "/v1/assessments/3b1f7c1e-2a4d-4c1b-9d7e-0c5a1e2f3a4b"
            trace_id: "c8f2b1d4e7"
            errors:
              - field: "questions[1].correct_option"
                message: "Requerido para publicar."
    RateLimited:
      description: Límite de solicitudes por tenant excedido (FinOps del LLM y protección en picos).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: El cuerpo supera el tamaño permitido (40 MB para un apunte, 10 MB para el archivo de una tarea o una entrega).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Formato de archivo no soportado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TaskClosed:
      description: La tarea ya cerró (pasó su hora límite); type `task-closed`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: Un servicio del que depende la operación respondió algo inutilizable (por ejemplo, el modelo de IA).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Un servicio del que depende la operación (por ejemplo, el proveedor LLM) no está disponible.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
