        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/tutor-conversations/{conversationId}/messages:
    post:
      tags: [Tutor IA]
      summary: Enviar un mensaje al tutor
      description: |
        Envía una pregunta en una conversación y recibe la respuesta del tutor en streaming (`text/plain`, por fragmentos).
        El id de la conversación lo genera el cliente: si no existe, el primer mensaje la crea con el `mode` indicado
        (en una conversación existente manda el modo guardado). El servidor usa el historial guardado; el cliente
        solo envía la pregunta nueva.

        La pregunta y la respuesta se guardan juntas solo cuando la respuesta termina: si el LLM falla o el cliente
        corta la conexión, no se guarda nada. Por eso no usa `Idempotency-Key` (excepción documentada en ADR 0008):
        reintentar un turno fallido no duplica nada.

        Solo el rol `estudiante`, en un curso donde está matriculado. Las respuestas se basan en los apuntes del curso.
      operationId: sendTutorMessage
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorMessageInput'
      responses:
        '200':
          description: Respuesta del tutor, en streaming.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            X-Conversation-Mode:
              description: Modo de la conversación (`tutor` o `pruebas`).
              schema: { type: string, enum: [tutor, pruebas] }
            X-Tutor-Turn:
              description: "Cómo se respondió: `grounded` (con apuntes), `chat` (charla), `basic` (pregunta básica explicada sin apuntes: un cálculo o un concepto elemental), `no-info` (los apuntes no lo cubren) o `no-notes` (el curso aún no tiene apuntes)."
              schema: { type: string, enum: [grounded, chat, basic, no-info, no-notes] }
            X-Rag-Sources:
              description: Solo si `X-Tutor-Turn = grounded`. Arreglo JSON de `TutorSource`, codificado con encodeURIComponent.
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
              example: "El denominador indica en cuántas partes iguales se divide el todo [1]."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /courses/{courseId}/documents:
    get:
      tags: [Tutor IA]
      summary: Apuntes del tutor en un curso
      description: |
        Documentos indexados para el tutor IA del curso, del más reciente al más antiguo, con cuántos fragmentos
        tiene cada uno. `official = true` marca las Bases Curriculares del Mineduc (no las subió el docente).
        Solo el docente del curso y el admin del colegio; el estudiante del curso recibe `403`.
      operationId: listCourseDocuments
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Apuntes del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDocumentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/documents/{documentName}:
    put:
      tags: [Tutor IA]
      summary: Subir o reemplazar un apunte del tutor
      description: |
        Sube un archivo de apuntes como cuerpo binario (hasta 40 MB). El formato lo dice la extensión del nombre:
        `.pdf`, `.txt` o `.md`. El servidor extrae el texto, lo parte en fragmentos y calcula sus embeddings antes
        de responder (un PDF largo puede tardar minutos). Si ya existe un apunte con ese nombre, se reemplaza: por
        eso es `PUT` y no necesita `Idempotency-Key` (repetirlo deja el mismo resultado).

        Un PDF escaneado (sin texto seleccionable), dañado o protegido con contraseña responde `422`. También responde
        `422` (`suspicious-document`) si el texto trae órdenes dirigidas a la IA del tutor («ignora tus reglas», «actúa
        como…», etiquetas que imitan el prompt): el detalle indica la línea o la página, sin repetir la frase, y no se
        guarda nada. Es una revisión por patrones, no una garantía. Los nombres que empiezan con `MINEDUC` están
        reservados para las Bases Curriculares. Si el proveedor de embeddings no responde, o hay demasiados archivos
        procesándose a la vez (`busy`), `503` y no se guarda nada: se puede reintentar. Solo el docente del curso y el
        admin del colegio.
      operationId: putCourseDocument
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/DocumentName'
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string, format: binary }
          text/markdown:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Apunte reemplazado (ya existía uno con ese nombre).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDocument'
        '201':
          description: Apunte creado e indexado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDocument'
              example: { name: "fracciones.pdf", chunks: 12, official: false, pages: 4 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Tutor IA]
      summary: Quitar un apunte del tutor
      description: |
        Borra el apunte y sus fragmentos: el tutor deja de usarlo de inmediato. Solo el docente del curso y el admin
        del colegio. Si el apunte no existe en el curso responde `404`.
      operationId: deleteCourseDocument
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/DocumentName'
      responses:
        '204':
          description: Apunte borrado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tutor-conversations/{conversationId}:
    get:
      tags: [Tutor IA]
      summary: Ver una conversación con el tutor
      description: La conversación con todos sus mensajes en orden. Solo la ve su dueño; para cualquier otro usuario responde `404`.
      operationId: getTutorConversation
      parameters:
