openapi: 3.1.0
info:
  title: FeathersForAll API
  version: 1.11.0
  summary: API pública del monolito modular de FeathersForAll.
  description: |
    Contrato contract-first de FeathersForAll. Fuente de verdad para backend (Node.js + Express),
    frontend (React + Vite, ADR 0005) y cliente TypeScript generado.

    **Autenticación (v1.1, ADR 0007):** `POST /auth/login` con el RBD del colegio, el correo y la
    contraseña entrega un JWT HS256 (`sub`, `tenant_id`, `role`; 8 h). El resto de las operaciones
    exige `Authorization: Bearer <JWT>`. Cualquier fallo del login responde el mismo `401`; tras
    varios fallos seguidos de una misma cuenta responde `429` con `Retry-After`.

    **Privacidad (v1.1):** cada rol ve solo lo suyo. El estudiante ve sus asignaturas y sus notas
    (solo lectura), el docente los cursos que dicta y el admin su colegio. Lo aplica la API y,
    además, la base de datos (RLS de lectura por usuario).

    **Conversaciones del tutor (v1.2, ADR 0008):** el estudiante guarda sus conversaciones con el
    tutor IA por curso y las retoma en cualquier dispositivo. Solo las ve el propio estudiante (ni el
    docente ni el admin) y se borran al terminar el año escolar.

    **Apuntes del tutor (v1.3):** el docente del curso y el admin del colegio suben, listan y quitan
    los apuntes (PDF, TXT o Markdown) que usa el tutor IA de ese curso. El estudiante recibe `403`.

    **Ciclo mínimo (v1.4):** el docente crea cursos y matricula (H1), crea y publica evaluaciones (H2) y ve sus
    resultados y el libro de notas (H3); el estudiante las rinde y recibe puntaje, nota y retroalimentación al
    instante (H4). Las alternativas se identifican por su **índice** (desde 0): `correct_option` al crear y
    `selected_option` al rendir. El estudiante nunca recibe la alternativa correcta antes de entregar.
    **Evaluaciones con IA (v1.5):** el docente puede escribir la evaluación a mano, pedirle un borrador a la IA
    (`generateAssessment`, a partir de un tema y de los apuntes del curso) o ambas: la IA solo **propone**, no guarda
    nada; el docente revisa, edita y guarda con `createAssessment`, y puede seguir editando el borrador
    (`updateAssessment`) hasta publicarlo.
    **Nociones básicas (v1.6):** el tutor responde sin apuntes las preguntas elementales (un cálculo como `1+1` o un
    concepto de enseñanza básica como «¿qué es una fracción?»). Lo nuevo es el valor `basic` de la cabecera
    `X-Tutor-Turn`: la respuesta no sale de los apuntes del curso (no trae `X-Rag-Sources`). Los apuntes del docente
    siguen siendo la fuente principal: si cubren la pregunta, el turno es `grounded`.
    **Tope de preguntas y apuntes más seguros (v1.7):** cada estudiante tiene un tope de preguntas al tutor (por defecto
    10 por minuto, 100 por hora y 2 en curso a la vez); al pasarlo, `sendTutorMessage` responde `429` con `Retry-After`.
    Al subir un apunte, el servidor revisa que no traiga órdenes dirigidas a la IA («ignora tus reglas…»): si las trae
    responde `422` (`suspicious-document`) con la línea o página, sin repetir la frase, y no guarda nada. Si hay demasiados
    archivos procesándose a la vez, `putCourseDocument` responde `503` (`busy`) y conviene reintentar. Solo se agregan
    respuestas posibles: ningún cambio rompe a los clientes existentes.
    El tutor asíncrono (`tutor-questions`) queda **deprecado**: lo reemplazan las conversaciones guardadas.

    **Material y tareas (v1.8):** los apuntes que sube el docente ahora también los ven y descargan sus estudiantes
    (`listCourseMaterials`). El docente publica tareas con fecha y hora límite (`createTask`); cada estudiante sube un
    archivo y lo puede reemplazar hasta esa hora. Después la API responde `409` (`task-closed`) y la base de datos
    también lo rechaza. Los archivos se descargan siempre como adjunto. Solo se agregan operaciones nuevas.

    **Hora de cierre de las evaluaciones (v1.9):** `updateAssessmentStatus` acepta `closes_at` para fijar la hora de
    cierre al publicar (una duración, como «en 90 minutos», se manda ya convertida en fecha y hora) o para cambiarla
    después, por ejemplo para extender el plazo de una evaluación publicada. Antes, publicar un borrador cuyo cierre ya
    había pasado fallaba con `500`; ahora responde `409` con el motivo. Los clientes que solo mandan `status` siguen
    igual.

    **Preguntas de respuesta escrita (v1.10):** una pregunta puede ser `type: text`. El estudiante escribe su
    respuesta (`text_answer`) y se corrige al instante contra las `accepted_answers` del docente. No importan las
    mayúsculas, las tildes, los espacios de más, el tipo de apóstrofo ni la puntuación final, y los números se
    comparan por su valor. La base de datos hace la corrección, igual que con las alternativas. Las respuestas
    aceptadas nunca llegan al estudiante. Sin `type`, una pregunta sigue siendo de alternativas.

    **Revisión docente de respuestas escritas (v1.11):** una pregunta de texto sin `accepted_answers` la corrige el
    docente. La respuesta queda `pending_review`, vale 0 y la nota es provisional hasta la revisión. El docente ve
    todas las respuestas escritas (`listTextAnswers`) y marca cada una como correcta o incorrecta
    (`reviewTextAnswer`), también las que se corrigieron solas. El puntaje se recalcula al instante.

    **Multi-tenancy:** el tenant (colegio) NO viaja en la URL. Se obtiene del token JWT
    (claim `tenant_id`) y el backend lo fija por transacción en PostgreSQL (RLS, ADR 0002 D1).
    Un recurso de otro colegio responde `404` (no se revela su existencia).

    **Errores:** todos los errores usan RFC 7807 (`application/problem+json`) con `trace_id`.

    **Idempotencia:** los POST que crean recursos exigen `Idempotency-Key` (UUID). El servidor
    guarda la respuesta por clave durante 24 h.

    **Mock:** `npx @stoplight/prism-cli mock api/openapi.yaml` sirve los paths sin prefijo en http://127.0.0.1:4010.

    **Versionado:** prefijo `/v1`. Política en `Documentos/api/versioning-policy.md`.
  contact:
    name: Equipo FeathersForAll
    url: https://github.com/Erolayer-Cl/FeathersForAll
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.feathersforall.example/v1
    description: Producción (Render) — URL definitiva por confirmar
  - url: https://staging-api.feathersforall.example/v1
    description: Staging (Render)
  - url: http://localhost:3000/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Identidad
    description: Login por RBD + correo + contraseña y perfil del usuario autenticado (ADR 0007).
  - name: Notas
    description: Notas del estudiante en escala chilena 1,0–7,0, solo lectura.
  - name: Cursos
    description: Gestión de cursos y matrícula (H1).
  - name: Evaluaciones
    description: Creación, publicación y rendición de evaluaciones auto-corregidas (H2, H4).
  - name: Resultados
    description: Dashboard de resultados para el docente (H3).
  - name: Contenido
    description: Material del curso visible para el estudiante y tareas con hora límite (v1.8).
  - name: Tutor IA
    description: Consultas al tutor IA con RAG por curso/tenant (H5). Preguntas sueltas asíncronas vía SQS y conversaciones guardadas del estudiante con respuesta en streaming (ADR 0008).
paths:
  /auth/login:
    post:
      tags: [Identidad]
      summary: Iniciar sesión
      description: |
        Login en dos pasos: el RBD identifica al colegio y, dentro de ese colegio, se validan el correo
        y la contraseña. Es la única operación sin token. Cualquier fallo (RBD, correo o contraseña)
        responde el mismo `401`, para no revelar qué cuentas existen. Tras 5 fallos seguidos de una
        misma cuenta en 15 minutos responde `429` con `Retry-After`. No crea recursos, por eso no
        lleva `Idempotency-Key`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            examples:
              estudiante:
                value: { rbd: "99901", email: "camila@demo-a.cl", password: "demo1234" }
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      tags: [Identidad]
      summary: Mi perfil
      description: Perfil del usuario autenticado y su colegio. `401` si la cuenta fue desactivada.
      operationId: getMe
      responses:
        '200':
          description: Perfil.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/grades:
    get:
      tags: [Notas]
      summary: Mis asignaturas y mis notas
      description: |
        Solo estudiantes (otro rol: `403`). Lista TODAS las asignaturas con matrícula activa, también
        las que aún no tienen notas, con el promedio ponderado de cada una y si el tutor IA tiene
        apuntes del curso (`tutor_available`). Solo lectura.
      operationId: getMyGrades
      parameters:
        - name: course_id
          in: query
          required: false
          description: Limita la respuesta a una asignatura.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Asignaturas con sus notas.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyGrades'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/grades/{assessmentId}:
    get:
      tags: [Notas]
      summary: Detalle de una evaluación entregada
      description: Mi respuesta a cada pregunta, si fue correcta y la retroalimentación del docente. Solo estudiantes; `404` si no la entregué.
      operationId: getMyGradeDetail
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: Detalle de la evaluación.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses:
    post:
      tags: [Cursos]
      summary: Crear curso
      description: |
        Crea un curso en el tenant del usuario autenticado (H1). Rol requerido `docente` (a su nombre) o `admin_colegio`
        (indicando `teacher_id`). Un docente que pide un curso a nombre de otro recibe `403`; un `teacher_id` que no es
        docente de tu colegio, `422`.
      operationId: createCourse
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
            examples:
              matematicas:
                value: { name: "Matemáticas 7° Básico A", period: "2026-S2", subject: "Matemática", grade_level: "7B" }
      responses:
        '201':
          description: Curso creado.
          headers:
            Location:
              description: URL del curso creado.
              schema: { type: string }
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Cursos]
      summary: Listar cursos
      description: |
        Cursos visibles para el usuario: el estudiante ve sus asignaturas (matrícula activa), el docente
        los cursos que dicta y el admin todos los de su colegio. Cada curso indica si el tutor IA tiene
        apuntes (`tutor_available`, `tutor_documents`); `students_count` solo lo ve el personal.
        Paginación por cursor (keyset): orden por periodo descendente y luego por nombre.
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: period
          in: query
          required: false
          description: Filtra por periodo académico.
          schema: { type: string, example: "2026-S2" }
      responses:
        '200':
          description: Página de cursos.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}:
    get:
      tags: [Cursos]
      summary: Obtener curso
      description: Devuelve un curso en el que el usuario participa (estudiante matriculado, su docente o el admin del colegio). Si no participa o es de otro colegio responde 404 (no se revela su existencia).
      operationId: getCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/enrollments:
    post:
      tags: [Cursos]
      summary: Matricular estudiante
      description: |
        Matricula a un estudiante del mismo tenant por su correo institucional (H1). Si el correo no es de un
        estudiante de tu colegio (incluido el que pertenece a otro colegio), responde 404; si ya está matriculado, 409.
        Solo el docente del curso y el admin; otro docente y el estudiante reciben 403.
      operationId: enrollStudent
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentInput'
      responses:
        '201':
          description: Estudiante matriculado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Cursos]
      summary: Estudiantes matriculados
      description: Estudiantes con matrícula activa del curso, por nombre. Solo el docente del curso y el admin (el estudiante recibe 403; quien no participa, 404).
      operationId: listEnrollments
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Matriculados del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/assessments:
    post:
      tags: [Evaluaciones]
      summary: Crear evaluación
      description: |
        Crea una evaluación de alternativas en estado `draft` con retroalimentación por pregunta (H2). La alternativa
        correcta (`correct_option`, índice desde 0) puede faltar mientras es borrador, pero es obligatoria para publicar.
        Solo el docente del curso y el admin; el estudiante y otro docente reciben 403.
      operationId: createAssessment
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentInput'
      responses:
        '201':
          description: Evaluación creada en borrador.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Evaluaciones]
      summary: Evaluaciones de un curso
      description: |
        Docente del curso y admin: todas, con borradores y cuántos estudiantes entregaron. Estudiante matriculado: solo
        las publicadas y cerradas (nunca borradores), con su nota si ya la rindió. Otro docente recibe 403; un estudiante
        sin matrícula, 404.
      operationId: listAssessments
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Evaluaciones del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSummaryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/assessments/generate:
    post:
      tags: [Evaluaciones]
      summary: Proponer una evaluación con IA
      description: |
        Genera con IA un **borrador propuesto** de evaluación a partir de un tema y, por defecto, de los apuntes del
        curso (solo los de ese curso y colegio). No guarda nada: el docente lo revisa, lo edita y lo guarda con
        `createAssessment`. La IA puede equivocarse: la alternativa correcta y la retroalimentación deben revisarse.

        Con `use_notes = true` (por defecto) y sin apuntes sobre el tema responde `422`; con `false` genera solo del tema.
        Si el modelo no devuelve preguntas utilizables responde `502`, y si el servicio no está disponible, `503`.
        Cada usuario tiene un tope de generaciones por ventana de tiempo (`429` con `Retry-After`).
        Solo el docente del curso y el admin.
      operationId: generateAssessment
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAssessmentInput'
      responses:
        '200':
          description: Borrador propuesto (sin guardar).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAssessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /assessments/{assessmentId}:
    get:
      tags: [Evaluaciones]
      summary: Ver una evaluación
      description: |
        Docente del curso y admin: la evaluación completa, con la alternativa correcta (`correct_option`) y la
        retroalimentación de cada pregunta. Estudiante matriculado: solo si está publicada o cerrada y SIN `correct_option`
        ni `feedback` (la retroalimentación llega al entregar). Un borrador no existe para el estudiante (404).
      operationId: getAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: Evaluación.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Evaluaciones]
      summary: Editar un borrador
      description: |
        Reemplaza el título, el cierre y las preguntas de una evaluación **en borrador** (incluido uno generado con IA).
        Una evaluación publicada o cerrada ya tiene entregas y notas: no se edita (`409`). Es `PUT` porque repetirlo
        deja el mismo resultado. Solo el docente del curso y el admin.
      operationId: updateAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentInput'
      responses:
        '200':
          description: Borrador actualizado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Evaluaciones]
      summary: Borrar un borrador
      description: Borra una evaluación en borrador con sus preguntas. Una publicada o cerrada no se borra (`409`). Solo el docente del curso y el admin.
      operationId: deleteAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '204':
          description: Borrador borrado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [Evaluaciones]
      summary: Publicar, cerrar o cambiar la hora de cierre
      description: |
        Cambia el estado de la evaluación (H2). No se puede publicar si alguna pregunta no tiene respuesta correcta: `422`
        con `errors` indicando cuáles. Solo se publica un borrador y solo se cierra una publicada (si no, `409`).

        `closes_at` (v1.9) fija la hora de cierre: una fecha futura con zona horaria, a menos de 366 días, o `null`
        para que no se cierre sola.
        - Con `status: published`: se publica y se fija la hora en el mismo paso. Si no viene, se conserva la del
          borrador. Si esa hora ya pasó, `409`.
        - Sin `status`: solo cambia la hora de un borrador o de una publicada. Extender el plazo de una publicada que
          ya venció la reabre. Una cerrada responde `409`.
        - Con `status: closed` no se envía (`400`): se cierra en ese momento.
      operationId: updateAssessmentStatus
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentStatusInput'
      responses:
        '200':
          description: Evaluación actualizada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
