  /courses/{courseId}/tutor-conversations:
    get:
      tags: [Tutor IA]
      summary: Mis conversaciones con el tutor en un curso
      description: |
        Conversaciones guardadas del estudiante autenticado en el curso, de la más reciente a la más antigua.
        Solo el rol `estudiante`; el docente y el admin reciben `403` (las conversaciones son privadas, ADR 0008).
      operationId: listTutorConversations
      parameters:
        - $ref: '#/components/parameters/CourseId'
