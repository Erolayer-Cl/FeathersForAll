  /courses/{courseId}/tutor-questions:
    post:
      tags: [Tutor IA]
      summary: Preguntar al tutor IA
      description: |
        Encola una pregunta al tutor IA del curso (H5). Se procesa de forma asíncrona (SQS + worker, ADR 0003).
        Responde 202 con la URL para consultar el estado. Solo se usan como fuente los apuntes del curso y tenant del estudiante.

        **Deprecado (v1.4):** el backend nunca la implementó. La alternativa son las conversaciones guardadas con respuesta
        en streaming (`sendTutorMessage`). Se retirará cuando termine el plazo de deprecación de la política de versionado.
      deprecated: true
      operationId: askTutor
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorQuestionInput'
      responses:
        '202':
          description: Pregunta aceptada y encolada.
          headers:
            Location:
              description: URL para consultar la respuesta.
              schema: { type: string }
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tutor-questions/{questionId}:
    get:
      tags: [Tutor IA]
      summary: Consultar respuesta del tutor IA
      description: |
        Devuelve el estado y, cuando está lista, la respuesta con sus fuentes. Si no hay contenido de respaldo, `grounded = false` y el tutor indica que no tiene información suficiente.

        **Deprecado (v1.4):** va con `askTutor`; ver `sendTutorMessage` y `getTutorConversation`.
      deprecated: true
      operationId: getTutorQuestion
      parameters:
        - name: questionId
          in: path
          required: true
          description: Identificador de la pregunta.
          schema: { type: string, format: uuid }
      responses:
