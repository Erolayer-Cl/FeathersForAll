openapi: 3.1.0
info:
  title: FeathersForAll API
  version: 1.4.0
  summary: API pública del monolito modular de FeathersForAll.
  description: |
    Contrato contract-first de FeathersForAll. Fuente de verdad para backend (Node.js + Express),
    frontend (React + Vite, ADR 0005) y cliente TypeScript generado.

    **Autenticación (v1.1, ADR 0007):** `POST /auth/login` con el RBD del colegio, el correo y la
    contraseña entrega un JWT HS256 (`sub`, `tenant_id`, `role`; 8 h). El resto de las operaciones
    exige `Authorization: Bearer <JWT>`. Cualquier fallo del login responde el mismo `401`; tras
    varios fallos seguidos de una misma cuenta responde `429` con `Retry-After`.

    **Privacidad (v1.1):** cada rol ve solo lo suyo. El estudiante ve sus asignaturas y sus notas
    (solo lectura), el docente los cursos que dicta y el admin su colegio. Lo aplica la API y,
    además, la base de datos (RLS de lectura por usuario).

    **Conversaciones del tutor (v1.2, ADR 0008):** el estudiante guarda sus conversaciones con el
    tutor IA por curso y las retoma en cualquier dispositivo. Solo las ve el propio estudiante (ni el
    docente ni el admin) y se borran al terminar el año escolar.

    **Apuntes del tutor (v1.3):** el docente del curso y el admin del colegio suben, listan y quitan
    los apuntes (PDF, TXT o Markdown) que usa el tutor IA de ese curso. El estudiante recibe `403`.

    **Ciclo mínimo (v1.4):** el docente crea cursos y matricula (H1), crea y publica evaluaciones (H2) y ve sus
    resultados y el libro de notas (H3); el estudiante las rinde y recibe puntaje, nota y retroalimentación al
    instante (H4). Las alternativas se identifican por su **índice** (desde 0): `correct_option` al crear y
    `selected_option` al rendir. El estudiante nunca recibe la alternativa correcta antes de entregar.
    El tutor asíncrono (`tutor-questions`) queda **deprecado**: lo reemplazan las conversaciones guardadas.

    **Multi-tenancy:** el tenant (colegio) NO viaja en la URL. Se obtiene del token JWT
    (claim `tenant_id`) y el backend lo fija por transacción en PostgreSQL (RLS, ADR 0002 D1).
    Un recurso de otro colegio responde `404` (no se revela su existencia).

    **Errores:** todos los errores usan RFC 7807 (`application/problem+json`) con `trace_id`.

    **Idempotencia:** los POST que crean recursos exigen `Idempotency-Key` (UUID). El servidor
    guarda la respuesta por clave durante 24 h.

    **Mock:** `npx @stoplight/prism-cli mock api/openapi.yaml` sirve los paths sin prefijo en http://127.0.0.1:4010.

    **Versionado:** prefijo `/v1`. Política en `Documentos/api/versioning-policy.md`.
  contact:
    name: Equipo FeathersForAll
    url: https://github.com/Erolayer-Cl/FeathersForAll
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.feathersforall.example/v1
    description: Producción (Render) — URL definitiva por confirmar
  - url: https://staging-api.feathersforall.example/v1
    description: Staging (Render)
  - url: http://localhost:3000/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Identidad
    description: Login por RBD + correo + contraseña y perfil del usuario autenticado (ADR 0007).
  - name: Notas
    description: Notas del estudiante en escala chilena 1,0–7,0, solo lectura.
  - name: Cursos
    description: Gestión de cursos y matrícula (H1).
  - name: Evaluaciones
    description: Creación, publicación y rendición de evaluaciones auto-corregidas (H2, H4).
  - name: Resultados
    description: Dashboard de resultados para el docente (H3).
  - name: Tutor IA
    description: Consultas al tutor IA con RAG por curso/tenant (H5). Preguntas sueltas asíncronas vía SQS y conversaciones guardadas del estudiante con respuesta en streaming (ADR 0008).
paths:
  /auth/login:
    post:
      tags: [Identidad]
      summary: Iniciar sesión
      description: |
        Login en dos pasos: el RBD identifica al colegio y, dentro de ese colegio, se validan el correo
        y la contraseña. Es la única operación sin token. Cualquier fallo (RBD, correo o contraseña)
        responde el mismo `401`, para no revelar qué cuentas existen. Tras 5 fallos seguidos de una
        misma cuenta en 15 minutos responde `429` con `Retry-After`. No crea recursos, por eso no
        lleva `Idempotency-Key`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            examples:
              estudiante:
                value: { rbd: "99901", email: "camila@demo-a.cl", password: "demo1234" }
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      tags: [Identidad]
      summary: Mi perfil
      description: Perfil del usuario autenticado y su colegio. `401` si la cuenta fue desactivada.
      operationId: getMe
      responses:
        '200':
          description: Perfil.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/grades:
    get:
      tags: [Notas]
      summary: Mis asignaturas y mis notas
      description: |
        Solo estudiantes (otro rol: `403`). Lista TODAS las asignaturas con matrícula activa, también
        las que aún no tienen notas, con el promedio ponderado de cada una y si el tutor IA tiene
        apuntes del curso (`tutor_available`). Solo lectura.
      operationId: getMyGrades
      parameters:
        - name: course_id
          in: query
          required: false
          description: Limita la respuesta a una asignatura.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Asignaturas con sus notas.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyGrades'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/grades/{assessmentId}:
    get:
      tags: [Notas]
      summary: Detalle de una evaluación entregada
      description: Mi respuesta a cada pregunta, si fue correcta y la retroalimentación del docente. Solo estudiantes; `404` si no la entregué.
      operationId: getMyGradeDetail
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: Detalle de la evaluación.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses:
    post:
      tags: [Cursos]
      summary: Crear curso
      description: |
        Crea un curso en el tenant del usuario autenticado (H1). Rol requerido `docente` (a su nombre) o `admin_colegio`
        (indicando `teacher_id`). Un docente que pide un curso a nombre de otro recibe `403`; un `teacher_id` que no es
        docente de tu colegio, `422`.
      operationId: createCourse
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
            examples:
              matematicas:
                value: { name: "Matemáticas 7° Básico A", period: "2026-S2", subject: "Matemática", grade_level: "7B" }
      responses:
        '201':
          description: Curso creado.
          headers:
            Location:
              description: URL del curso creado.
              schema: { type: string }
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Cursos]
      summary: Listar cursos
      description: |
        Cursos visibles para el usuario: el estudiante ve sus asignaturas (matrícula activa), el docente
        los cursos que dicta y el admin todos los de su colegio. Cada curso indica si el tutor IA tiene
        apuntes (`tutor_available`, `tutor_documents`); `students_count` solo lo ve el personal.
        Paginación por cursor (keyset): orden por periodo descendente y luego por nombre.
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: period
          in: query
          required: false
          description: Filtra por periodo académico.
          schema: { type: string, example: "2026-S2" }
      responses:
        '200':
          description: Página de cursos.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}:
    get:
      tags: [Cursos]
      summary: Obtener curso
      description: Devuelve un curso en el que el usuario participa (estudiante matriculado, su docente o el admin del colegio). Si no participa o es de otro colegio responde 404 (no se revela su existencia).
      operationId: getCourse
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/enrollments:
    post:
      tags: [Cursos]
      summary: Matricular estudiante
      description: |
        Matricula a un estudiante del mismo tenant por su correo institucional (H1). Si el correo no es de un
        estudiante de tu colegio (incluido el que pertenece a otro colegio), responde 404; si ya está matriculado, 409.
        Solo el docente del curso y el admin; otro docente y el estudiante reciben 403.
      operationId: enrollStudent
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentInput'
      responses:
        '201':
          description: Estudiante matriculado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Cursos]
      summary: Estudiantes matriculados
      description: Estudiantes con matrícula activa del curso, por nombre. Solo el docente del curso y el admin (el estudiante recibe 403; quien no participa, 404).
      operationId: listEnrollments
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Matriculados del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/assessments:
    post:
      tags: [Evaluaciones]
      summary: Crear evaluación
      description: |
        Crea una evaluación de alternativas en estado `draft` con retroalimentación por pregunta (H2). La alternativa
        correcta (`correct_option`, índice desde 0) puede faltar mientras es borrador, pero es obligatoria para publicar.
        Solo el docente del curso y el admin; el estudiante y otro docente reciben 403.
      operationId: createAssessment
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentInput'
      responses:
        '201':
          description: Evaluación creada en borrador.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Evaluaciones]
      summary: Evaluaciones de un curso
      description: |
        Docente del curso y admin: todas, con borradores y cuántos estudiantes entregaron. Estudiante matriculado: solo
        las publicadas y cerradas (nunca borradores), con su nota si ya la rindió. Otro docente recibe 403; un estudiante
        sin matrícula, 404.
      operationId: listAssessments
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Evaluaciones del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSummaryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /assessments/{assessmentId}:
    get:
      tags: [Evaluaciones]
      summary: Ver una evaluación
      description: |
        Docente del curso y admin: la evaluación completa, con la alternativa correcta (`correct_option`) y la
        retroalimentación de cada pregunta. Estudiante matriculado: solo si está publicada o cerrada y SIN `correct_option`
        ni `feedback` (la retroalimentación llega al entregar). Un borrador no existe para el estudiante (404).
      operationId: getAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: Evaluación.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Evaluaciones]
      summary: Publicar o cerrar evaluación
      description: |
        Cambia el estado de la evaluación (H2). No se puede publicar si alguna pregunta no tiene respuesta correcta: `422`
        con `errors` indicando cuáles. Solo se publica un borrador y solo se cierra una publicada (si no, `409`).
      operationId: updateAssessmentStatus
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentStatusInput'
      responses:
        '200':
          description: Evaluación actualizada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /assessments/{assessmentId}/submissions:
    post:
      tags: [Evaluaciones]
      summary: Rendir evaluación
      description: |
        El estudiante envía sus respuestas y recibe puntaje, nota (escala 1,0–7,0) y retroalimentación al instante (H4).
        `selected_option` es el índice (desde 0) de la alternativa elegida; una pregunta sin responder cuenta como
        incorrecta. Requiere estar matriculado y que la evaluación esté publicada (si no, 404). Un segundo envío
        responde 409 con el resultado anterior en `detail`, y una evaluación cerrada o vencida, 409. Docente y admin
        reciben 403. Reintentar con la misma `Idempotency-Key` devuelve la misma respuesta sin duplicar.
      operationId: submitAssessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      responses:
        '201':
          description: Respuestas registradas y corregidas.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /assessments/{assessmentId}/results:
    get:
      tags: [Resultados]
      summary: Dashboard de resultados
      description: Resultados agregados de la evaluación para el docente (H3). Sin respuestas devuelve `submissions_count = 0` y listas vacías (no error).
      operationId: getAssessmentResults
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - name: student_id
          in: query
          required: false
          description: Filtra el detalle por estudiante.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resultados agregados.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/gradebook:
    get:
      tags: [Notas]
      summary: Libro de notas del curso
      description: Una fila por estudiante activo y una columna por evaluación, con el promedio de cada uno y el del curso. Solo el docente del curso y el admin (otro docente y el estudiante reciben 403).
      operationId: getGradebook
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Libro de notas.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gradebook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/grades/summary:
    get:
      tags: [Notas]
      summary: Resumen de notas y estudiantes en riesgo
      description: Estadísticas por evaluación (entregas, pendientes, promedio, mínimo, máximo, aprobados) y los estudiantes cuyo promedio está bajo el umbral (4,0 por defecto). Solo el docente del curso y el admin.
      operationId: getGradesSummary
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: threshold
          in: query
          required: false
          description: Nota bajo la cual un estudiante se considera en riesgo (1,0–7,0).
          schema: { type: number, minimum: 1, maximum: 7, default: 4 }
      responses:
        '200':
          description: Resumen del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradesSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/students/{studentId}/grades:
    get:
      tags: [Notas]
      summary: Notas de un estudiante en un curso
      description: Las notas de un estudiante en el curso. Las ve el docente del curso, el admin y el propio estudiante (solo las suyas, y mientras esté matriculado); a otro estudiante le responde 403.
      operationId: getStudentGrades
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: studentId
          in: path
          required: true
          description: Identificador del estudiante.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notas del estudiante en el curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCourseGrades'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /assessments/{assessmentId}/grading:
    patch:
      tags: [Notas]
      summary: Cambiar exigencia o ponderación
      description: Cambia el porcentaje de logro que equivale al 4,0 (`pass_threshold`) y/o el peso de la evaluación en el promedio (`weight`). Las notas se recalculan solas. Solo el docente del curso y el admin.
      operationId: updateAssessmentGrading
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradingInput'
      responses:
        '200':
          description: Calificación actualizada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/tutor-questions:
    post:
      tags: [Tutor IA]
      summary: Preguntar al tutor IA
      description: |
        Encola una pregunta al tutor IA del curso (H5). Se procesa de forma asíncrona (SQS + worker, ADR 0003).
        Responde 202 con la URL para consultar el estado. Solo se usan como fuente los apuntes del curso y tenant del estudiante.

        **Deprecado (v1.4):** el backend nunca la implementó. La alternativa son las conversaciones guardadas con respuesta
        en streaming (`sendTutorMessage`). Se retirará cuando termine el plazo de deprecación de la política de versionado.
      deprecated: true
      operationId: askTutor
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorQuestionInput'
      responses:
        '202':
          description: Pregunta aceptada y encolada.
          headers:
            Location:
              description: URL para consultar la respuesta.
              schema: { type: string }
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tutor-questions/{questionId}:
    get:
      tags: [Tutor IA]
      summary: Consultar respuesta del tutor IA
      description: |
        Devuelve el estado y, cuando está lista, la respuesta con sus fuentes. Si no hay contenido de respaldo, `grounded = false` y el tutor indica que no tiene información suficiente.

        **Deprecado (v1.4):** va con `askTutor`; ver `sendTutorMessage` y `getTutorConversation`.
      deprecated: true
      operationId: getTutorQuestion
      parameters:
        - name: questionId
          in: path
          required: true
          description: Identificador de la pregunta.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado de la pregunta.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/tutor-conversations:
    get:
      tags: [Tutor IA]
      summary: Mis conversaciones con el tutor en un curso
      description: |
        Conversaciones guardadas del estudiante autenticado en el curso, de la más reciente a la más antigua.
        Solo el rol `estudiante`; el docente y el admin reciben `403` (las conversaciones son privadas, ADR 0008).
      operationId: listTutorConversations
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversaciones del estudiante en el curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConversationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/tutor-conversations/{conversationId}/messages:
    post:
      tags: [Tutor IA]
      summary: Enviar un mensaje al tutor
      description: |
        Envía una pregunta en una conversación y recibe la respuesta del tutor en streaming (`text/plain`, por fragmentos).
        El id de la conversación lo genera el cliente: si no existe, el primer mensaje la crea con el `mode` indicado
        (en una conversación existente manda el modo guardado). El servidor usa el historial guardado; el cliente
        solo envía la pregunta nueva.

        La pregunta y la respuesta se guardan juntas solo cuando la respuesta termina: si el LLM falla o el cliente
        corta la conexión, no se guarda nada. Por eso no usa `Idempotency-Key` (excepción documentada en ADR 0008):
        reintentar un turno fallido no duplica nada.

        Solo el rol `estudiante`, en un curso donde está matriculado. Las respuestas se basan en los apuntes del curso.
      operationId: sendTutorMessage
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorMessageInput'
      responses:
        '200':
          description: Respuesta del tutor, en streaming.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
            X-Conversation-Mode:
              description: Modo de la conversación (`tutor` o `pruebas`).
              schema: { type: string, enum: [tutor, pruebas] }
            X-Tutor-Turn:
              description: "Cómo se respondió: `grounded` (con apuntes), `chat` (charla), `no-info` (los apuntes no lo cubren) o `no-notes` (el curso aún no tiene apuntes)."
              schema: { type: string, enum: [grounded, chat, no-info, no-notes] }
            X-Rag-Sources:
              description: Solo si `X-Tutor-Turn = grounded`. Arreglo JSON de `TutorSource`, codificado con encodeURIComponent.
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
              example: "El denominador indica en cuántas partes iguales se divide el todo [1]."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /courses/{courseId}/documents:
    get:
      tags: [Tutor IA]
      summary: Apuntes del tutor en un curso
      description: |
        Documentos indexados para el tutor IA del curso, del más reciente al más antiguo, con cuántos fragmentos
        tiene cada uno. `official = true` marca las Bases Curriculares del Mineduc (no las subió el docente).
        Solo el docente del curso y el admin del colegio; el estudiante del curso recibe `403`.
      operationId: listCourseDocuments
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Apuntes del curso.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDocumentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /courses/{courseId}/documents/{documentName}:
    put:
      tags: [Tutor IA]
      summary: Subir o reemplazar un apunte del tutor
      description: |
        Sube un archivo de apuntes como cuerpo binario (hasta 40 MB). El formato lo dice la extensión del nombre:
        `.pdf`, `.txt` o `.md`. El servidor extrae el texto, lo parte en fragmentos y calcula sus embeddings antes
        de responder (un PDF largo puede tardar minutos). Si ya existe un apunte con ese nombre, se reemplaza: por
        eso es `PUT` y no necesita `Idempotency-Key` (repetirlo deja el mismo resultado).

        Un PDF escaneado (sin texto seleccionable), dañado o protegido con contraseña responde `422`. Los nombres
        que empiezan con `MINEDUC` están reservados para las Bases Curriculares. Si el proveedor de embeddings no
        responde, `503` y no se guarda nada. Solo el docente del curso y el admin del colegio.
      operationId: putCourseDocument
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/DocumentName'
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string, format: binary }
          text/markdown:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Apunte reemplazado (ya existía uno con ese nombre).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDocument'
        '201':
          description: Apunte creado e indexado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDocument'
              example: { name: "fracciones.pdf", chunks: 12, official: false, pages: 4 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Tutor IA]
      summary: Quitar un apunte del tutor
      description: |
        Borra el apunte y sus fragmentos: el tutor deja de usarlo de inmediato. Solo el docente del curso y el admin
        del colegio. Si el apunte no existe en el curso responde `404`.
      operationId: deleteCourseDocument
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/DocumentName'
      responses:
        '204':
          description: Apunte borrado.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tutor-conversations/{conversationId}:
    get:
      tags: [Tutor IA]
      summary: Ver una conversación con el tutor
      description: La conversación con todos sus mensajes en orden. Solo la ve su dueño; para cualquier otro usuario responde `404`.
      operationId: getTutorConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversación con sus mensajes.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConversationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tutor IA]
      summary: Borrar una conversación con el tutor
      description: Borra la conversación y sus mensajes. Solo su dueño; para cualquier otro usuario responde `404`.
      operationId: deleteTutorConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '204':
          description: Conversación borrada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 emitido por `POST /auth/login` (ADR 0007; el SSO institucional queda como evolución). Incluye `sub`, `tenant_id` y `role` (`docente`, `estudiante`, `admin_colegio`).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente. Misma clave en 24 h = misma respuesta, sin duplicar.
      schema: { type: string, format: uuid }
    CourseId:
      name: courseId
      in: path
      required: true
      description: Identificador del curso.
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Identificador de la conversación con el tutor (UUID que genera el cliente).
      schema: { type: string, format: uuid }
    DocumentName:
      name: documentName
      in: path
      required: true
      description: Nombre del apunte en el curso, con su extensión (por ejemplo `fracciones.pdf`). Codificado con encodeURIComponent.
      schema: { type: string, minLength: 1, maxLength: 120 }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      description: Identificador de la evaluación.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto en `next_cursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    X-Trace-Id:
      description: Identificador de traza para correlacionar logs (CloudWatch).
      schema: { type: string }
    X-RateLimit-Remaining:
      description: Solicitudes restantes en la ventana para el tenant.
      schema: { type: integer }
    Retry-After:
      description: Segundos a esperar antes de reintentar.
      schema: { type: integer }
  schemas:
    Problem:
      type: object
      description: Error RFC 7807.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: "https://api.feathersforall.example/errors/validation" }
        title: { type: string, example: "Datos inválidos" }
        status: { type: integer, example: 422 }
        detail: { type: string, example: "La pregunta 2 no tiene respuesta correcta." }
        instance: { type: string, example: "/v1/assessments/5f0c.../" }
        trace_id: { type: string, example: "c8f2b1d4e7" }
        errors:
          type: array
          description: Detalle por campo (solo en 422).
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: "questions[1].correct_option" }
              message: { type: string, example: "Requerido para publicar." }
    CourseInput:
      type: object
      required: [name, period]
      properties:
        name: { type: string, minLength: 3, maxLength: 120, example: "Matemáticas 7° Básico A" }
        period: { type: string, pattern: '^\d{4}-S[12]$', example: "2026-S2" }
        subject: { type: string, maxLength: 80, example: "Matemática" }
        grade_level: { type: string, maxLength: 10, example: "7B" }
        teacher_id:
          type: string
          format: uuid
          description: Docente que dicta el curso. Solo lo indica el administrador (obligatorio para él); un docente crea cursos a su nombre.
    Course:
      allOf:
        - $ref: '#/components/schemas/CourseInput'
        - type: object
          required: [id, teacher_id, created_at]
          properties:
            id: { type: string, format: uuid }
            teacher_id: { type: string, format: uuid }
            teacher_name: { type: string, example: "Ana Rojas" }
            students_count: { type: integer, minimum: 0, description: "Estudiantes con matrícula activa. Solo para docente y admin." }
            tutor_available: { type: boolean, description: "El tutor IA tiene apuntes indexados de este curso." }
            tutor_documents: { type: integer, minimum: 0, description: "Apuntes que el docente subió al tutor." }
            created_at: { type: string, format: date-time }
    CoursePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Course' }
        next_cursor:
          type: [string, 'null']
          description: Cursor de la siguiente página; null si no hay más.
    LoginInput:
      type: object
      required: [rbd, email, password]
      properties:
        rbd: { type: string, minLength: 1, maxLength: 20, description: "RBD del colegio.", example: "99901" }
        email: { type: string, format: email, maxLength: 150, example: "camila@demo-a.cl" }
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    School:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Colegio Demo A" }
        rbd: { type: [string, 'null'], example: "99901" }
    Me:
      type: object
      required: [id, name, email, role, school]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Camila Díaz" }
        email: { type: string, format: email }
        role: { type: string, enum: [estudiante, docente, admin_colegio] }
        school: { $ref: '#/components/schemas/School' }
    Session:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, description: "JWT HS256 con sub, tenant_id y role." }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: "Segundos de validez del token.", example: 28800 }
        user: { $ref: '#/components/schemas/Me' }
    GradeEntry:
      type: object
      required: [assessment_id, title, grade]
      properties:
        assessment_id: { type: string, format: uuid }
        title: { type: string, example: "Fracciones" }
        score: { type: number, minimum: 0, maximum: 100, description: "Puntaje en % de logro." }
        grade: { type: number, minimum: 1, maximum: 7, description: "Nota 1,0–7,0 (se calcula con el puntaje y la exigencia)." }
        weight: { type: number, exclusiveMinimum: 0, description: "Ponderación de la evaluación en el promedio." }
        submitted_at: { type: string, format: date-time }
    MyCourseGrades:
      type: object
      required: [course_id, course, grades]
      properties:
        course_id: { type: string, format: uuid }
        course: { type: string, example: "Matemáticas 7° Básico A" }
        subject: { type: [string, 'null'], example: "Matemática" }
        period: { type: string, example: "2026-S2" }
        teacher_name: { type: string, example: "Ana Rojas" }
        tutor_available: { type: boolean }
        average: { type: [number, 'null'], description: "Promedio ponderado del ramo; null si aún no hay notas." }
        grades:
          type: array
          items: { $ref: '#/components/schemas/GradeEntry' }
    MyGrades:
      type: object
      required: [student_id, courses]
      properties:
        student_id: { type: string, format: uuid }
        courses:
          type: array
          items: { $ref: '#/components/schemas/MyCourseGrades' }
    StudentCourseGrades:
      type: object
      required: [course_id, course, student_id, grades]
      properties:
        course_id: { type: string, format: uuid }
        course: { type: string }
        student_id: { type: string, format: uuid }
        average: { type: [number, 'null'], description: "Promedio ponderado; null si aún no hay notas." }
        grades:
          type: array
          items: { $ref: '#/components/schemas/GradeEntry' }
    Gradebook:
      type: object
      required: [course_id, course, assessments, students]
      properties:
        course_id: { type: string, format: uuid }
        course: { type: string }
        assessments:
          type: array
          items:
            type: object
            required: [id, title, status]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string, enum: [borrador, publicada, cerrada] }
              pass_threshold: { type: number, description: "% de logro que equivale al 4,0." }
              weight: { type: number }
              published_at: { type: [string, 'null'], format: date-time }
        students:
          type: array
          items:
            type: object
            required: [student_id, name, grades]
            properties:
              student_id: { type: string, format: uuid }
              name: { type: string }
              average: { type: [number, 'null'] }
              grades:
                type: object
                description: "Nota por id de evaluación (null si no la rindió)."
                additionalProperties: { type: [number, 'null'] }
        course_average: { type: [number, 'null'], description: "Promedio simple de los promedios de los estudiantes." }
    GradesSummary:
      type: object
      required: [course_id, course, enrolled_students, assessments, at_risk_threshold, at_risk]
      properties:
        course_id: { type: string, format: uuid }
        course: { type: string }
        enrolled_students: { type: integer, minimum: 0 }
        assessments:
          type: array
          items:
            type: object
            required: [assessment_id, title, status, submissions, pending]
            properties:
              assessment_id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string, enum: [borrador, publicada, cerrada] }
              submissions: { type: integer, minimum: 0 }
              pending: { type: integer, minimum: 0, description: "Matriculados que aún no entregan." }
              average: { type: [number, 'null'] }
              min: { type: [number, 'null'] }
              max: { type: [number, 'null'] }
              passed: { type: [integer, 'null'] }
              failed: { type: [integer, 'null'] }
        at_risk_threshold: { type: number }
        at_risk:
          type: array
          items:
            type: object
            required: [student_id, name, average]
            properties:
              student_id: { type: string, format: uuid }
              name: { type: string }
              average: { type: number }
              assessments_taken: { type: integer, minimum: 0 }
    GradingInput:
      type: object
      minProperties: 1
      properties:
        pass_threshold: { type: number, minimum: 1, maximum: 99, description: "% de logro que equivale al 4,0 (por defecto 60)." }
        weight: { type: number, exclusiveMinimum: 0, maximum: 999, description: "Peso de la evaluación en el promedio." }
    GradingResult:
      type: object
      required: [assessment_id, title, pass_threshold, weight]
      properties:
        assessment_id: { type: string, format: uuid }
        title: { type: string }
        pass_threshold: { type: number }
        weight: { type: number }
    GradeDetail:
      allOf:
        - $ref: '#/components/schemas/GradeEntry'
        - type: object
          required: [answers]
          properties:
            pass_threshold: { type: number, description: "Exigencia: % de logro para el 4,0." }
            answers:
              type: array
              items:
                type: object
                required: [order, question, correct]
                properties:
                  order: { type: integer, minimum: 1 }
                  question: { type: string }
                  selected_option: { type: [string, 'null'], description: "Texto de la alternativa elegida." }
                  correct: { type: boolean }
                  feedback: { type: [string, 'null'] }
    EnrollmentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, student_id, name, email, enrolled_at]
            properties:
              id: { type: string, format: uuid, description: "Id de la matrícula." }
              student_id: { type: string, format: uuid }
              name: { type: string, example: "Camila Díaz" }
              email: { type: string, format: email }
              enrolled_at: { type: string, format: date-time }
    AssessmentSummaryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, title, status, questions_count]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string, enum: [draft, published, closed] }
              questions_count: { type: integer, minimum: 0 }
              published_at: { type: [string, 'null'], format: date-time }
              closes_at: { type: [string, 'null'], format: date-time }
              submissions_count: { type: integer, minimum: 0, description: "Estudiantes que entregaron. Solo para docente y admin." }
              submitted: { type: boolean, description: "El estudiante ya la rindió. Solo para el estudiante." }
              grade: { type: [number, 'null'], minimum: 1, maximum: 7, description: "Su nota. Solo para el estudiante." }
              score: { type: [number, 'null'], description: "Su porcentaje de logro. Solo para el estudiante." }
              submitted_at: { type: [string, 'null'], format: date-time, description: "Cuándo la entregó. Solo para el estudiante." }
    EnrollmentInput:
      type: object
      required: [student_email]
      properties:
        student_email: { type: string, format: email, example: "estudiante.demo@colegio-demo.cl" }
    Enrollment:
      type: object
      required: [id, course_id, student_id, enrolled_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        enrolled_at: { type: string, format: date-time }
    QuestionInput:
      type: object
      required: [statement, options]
      properties:
        statement: { type: string, minLength: 3, example: "¿Cuánto es 3/4 + 1/4?" }
        options:
          type: array
          minItems: 2
          maxItems: 6
          items: { type: string }
          example: ["1/2", "1", "4/8", "3/16"]
        correct_option:
          type: [integer, 'null']
          minimum: 0
          description: Índice de la alternativa correcta. Obligatorio para publicar.
          example: 1
        feedback:
          type: string
          description: Retroalimentación que ve el estudiante tras responder.
          example: "Suma los numeradores con igual denominador: 4/4 = 1."
    AssessmentInput:
      type: object
      required: [title, questions]
      properties:
        closes_at: { type: [string, 'null'], format: date-time, description: "Cierre automático (futuro). Sin fecha, la evaluación se cierra a mano." }
        title: { type: string, minLength: 3, maxLength: 150, example: "Prueba de fracciones" }
        max_attempts: { type: integer, minimum: 1, maximum: 1, default: 1, description: "MVP: un intento." }
        questions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QuestionInput' }
    Assessment:
      type: object
      required: [id, course_id, title, status, questions]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [draft, published, closed] }
        max_attempts: { type: integer }
        questions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuestionInput'
              - type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        published_at: { type: [string, 'null'], format: date-time }
        closes_at: { type: [string, 'null'], format: date-time }
    AssessmentStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [published, closed] }
    SubmissionInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [question_id, selected_option]
            properties:
              question_id: { type: string, format: uuid }
              selected_option: { type: integer, minimum: 0 }
    SubmissionResult:
      type: object
      required: [id, assessment_id, score, max_score, answers, submitted_at]
      properties:
        percentage: { type: [number, 'null'], minimum: 0, maximum: 100, description: "Porcentaje de logro (0–100).", example: 50 }
        grade: { type: [number, 'null'], minimum: 1, maximum: 7, description: "Nota en escala chilena 1,0–7,0, según la exigencia de la evaluación.", example: 3.5 }
        id: { type: string, format: uuid }
        assessment_id: { type: string, format: uuid }
        score: { type: integer, minimum: 0, example: 8 }
        max_score: { type: integer, minimum: 1, example: 10 }
        answers:
          type: array
          items:
            type: object
            required: [question_id, correct, feedback]
            properties:
              question_id: { type: string, format: uuid }
              correct: { type: boolean }
              feedback: { type: string }
        submitted_at: { type: string, format: date-time }
    AssessmentResults:
      type: object
      required: [assessment_id, submissions_count, average_score, questions]
      properties:
        assessment_id: { type: string, format: uuid }
        submissions_count: { type: integer, minimum: 0 }
        average_score: { type: [number, 'null'], description: "null si no hay respuestas." }
        questions:
          type: array
          description: Porcentaje de aciertos por pregunta.
          items:
            type: object
            required: [question_id, correct_rate]
            properties:
              question_id: { type: string, format: uuid }
              correct_rate: { type: number, minimum: 0, maximum: 1 }
        students:
          type: array
          description: Detalle por estudiante (o solo uno si se filtra por `student_id`).
          items:
            type: object
            required: [student_id, score]
            properties:
              student_id: { type: string, format: uuid }
              score: { type: integer }
              submitted_at: { type: string, format: date-time }
    TutorQuestionInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 1000, example: "¿Por qué 3/4 + 1/4 da 1?" }
    TutorQuestion:
      type: object
      required: [id, course_id, status, question, created_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, answered, failed] }
        question: { type: string }
        answer: { type: [string, 'null'] }
        grounded:
          type: [boolean, 'null']
          description: true si la respuesta se basa en apuntes del curso; false si no hubo contenido de respaldo.
        sources:
          type: array
          description: Apuntes del curso usados como fuente (siempre del mismo tenant).
          items:
            type: object
            required: [note_id, title]
            properties:
              note_id: { type: string, format: uuid }
              title: { type: string }
        created_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
    TutorSource:
      type: object
      required: [doc_id, score]
      properties:
        doc_id: { type: string, description: "Apunte del curso usado como fuente.", example: "fracciones.md" }
        score: { type: number, minimum: 0, maximum: 1, description: "Similitud del fragmento con la pregunta.", example: 0.82 }
    TutorMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000, example: "¿Qué indica el denominador de una fracción?" }
        mode:
          type: string
          enum: [tutor, pruebas]
          default: tutor
          description: "Solo al crear la conversación: `tutor` (estudiar) o `pruebas` (practicar una prueba)."
    TutorConversation:
      type: object
      required: [id, course_id, mode, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        mode: { type: string, enum: [tutor, pruebas] }
        title: { type: string, maxLength: 60, description: "Inicio de la primera pregunta.", example: "¿Qué indica el denominador de una fracción?" }
        messages_count: { type: integer, minimum: 0, description: "Solo en la lista." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: "Último mensaje. La retención se cuenta desde aquí." }
    TutorConversationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TutorConversation' }
    TutorMessage:
      type: object
      required: [role, content, sources, created_at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        sources:
          type: array
          description: Apuntes usados en la respuesta (vacío en las preguntas y en la charla).
          items: { $ref: '#/components/schemas/TutorSource' }
        created_at: { type: string, format: date-time }
    TutorConversationDetail:
      allOf:
        - $ref: '#/components/schemas/TutorConversation'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/TutorMessage' }
    CourseDocument:
      type: object
      required: [name, chunks, official]
      properties:
        name: { type: string, example: "fracciones.pdf", description: "Nombre del apunte; identifica al documento dentro del curso." }
        chunks: { type: integer, minimum: 0, description: "Fragmentos indexados que el tutor puede citar." }
        official: { type: boolean, description: "Bases Curriculares del Mineduc (true) o apunte del docente (false)." }
        pages: { type: integer, minimum: 1, description: "Solo al subir un PDF: páginas leídas." }
    CourseDocumentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CourseDocument' }
  responses:
    BadRequest:
      description: Solicitud mal formada (por ejemplo, falta Idempotency-Key).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Token ausente o inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: El rol del usuario no permite la operación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe en el tenant del usuario (también si pertenece a otro colegio).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicto de estado (ya matriculado, evaluación ya rendida).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Datos inválidos según reglas de negocio.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: "https://api.feathersforall.example/errors/validation"
            title: "Datos inválidos"
            status: 422
            detail: "No se puede publicar: la pregunta 2 no tiene respuesta correcta."
            instance: "/v1/assessments/3b1f7c1e-2a4d-4c1b-9d7e-0c5a1e2f3a4b"
            trace_id: "c8f2b1d4e7"
            errors:
              - field: "questions[1].correct_option"
                message: "Requerido para publicar."
    RateLimited:
      description: Límite de solicitudes por tenant excedido (FinOps del LLM y protección en picos).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: El cuerpo supera el tamaño permitido (40 MB para un apunte).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Formato de archivo no soportado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Un servicio del que depende la operación (por ejemplo, el proveedor LLM) no está disponible.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
