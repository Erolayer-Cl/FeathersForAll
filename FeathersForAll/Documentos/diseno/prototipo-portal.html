*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-act);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell: cabecera con logo + menú lateral que se minimiza ---------- */
.app{--sbw:272px;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;z-index:30;width:var(--sbw);display:flex;flex-direction:column;gap:10px;padding:14px 14px 18px;background:var(--side);color:#fff;border-radius:0 var(--radius-lg) var(--radius-lg) 0;box-shadow:var(--shadow-lg);transition:transform var(--dur) var(--ease),visibility 0s}
.app[data-collapsed="true"] .sidebar{transform:translateX(calc(-100% - 48px));visibility:hidden;transition:transform var(--dur) var(--ease),visibility 0s linear var(--dur)}
.stage{margin-left:var(--sbw);min-width:0;transition:margin-left var(--dur) var(--ease)}
.app[data-collapsed="true"] .stage{margin-left:0}
.backdrop{position:fixed;inset:0;z-index:25;background:rgb(15 23 42/.5);opacity:0;pointer-events:none;transition:opacity .25s ease}
.sb-head{display:none;align-items:center;gap:12px}
.sb-title{font-family:var(--font-heading);font-size:20px}
.sb-user{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:6px 0 8px;border-radius:var(--radius-lg);background:rgba(255,255,255,.1)}
.sb-av{width:42px;height:42px;flex:none;border-radius:50%;background:var(--blue-act);display:grid;place-items:center;font-family:var(--font-heading);font-size:18px}
.sb-user b{display:block;font-size:15px}
.sb-user small{display:block;font-size:12px;opacity:.82;line-height:1.3}
.sb-nav{display:flex;flex-direction:column;gap:4px}
.sidebar .spacer{flex:1}
.nav{display:flex;align-items:center;gap:13px;padding:12px 18px;border-radius:var(--radius-pill);font-size:16px;font-weight:700;color:#fff;transition:background .2s ease,transform .2s var(--ease)}
.nav:hover{background:rgba(255,255,255,.12)}
.nav:active{transform:scale(.98)}
.nav.on{background:var(--blue-act)}
.ic{flex:none}
.sidebar :focus-visible{outline-color:#fff}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;padding:0;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--blue-tx);transition:background .2s ease,transform .2s var(--ease)}
.iconbtn:hover{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.iconbtn:active{transform:scale(.92)}
.iconbtn.light{color:#fff}
.iconbtn.light:hover{background:rgba(255,255,255,.14)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 40px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand-col{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brand-name{font-family:var(--font-heading);font-size:20px;color:var(--blue-tx);white-space:nowrap}
.mode-label{font-size:13px;font-weight:600;color:var(--blue-act);white-space:nowrap}
.roleswitch{margin-left:auto;display:flex;gap:2px;padding:4px;border-radius:var(--radius-pill);background:var(--blue-100)}
.rs{padding:7px 16px;border-radius:var(--radius-pill);font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;transition:background var(--dur) var(--ease),color .2s ease}
.rs:hover{color:var(--ink)}
.rs.on{background:var(--blue);color:#fff}
.logo{display:flex;flex:none;width:var(--s,52px);height:var(--s,52px);overflow:hidden;border-radius:var(--radius-pill);background:var(--blue)}
.logo i{display:block;width:100%;height:100%;background:#fff;-webkit-mask:var(--pluma) center/contain no-repeat;mask:var(--pluma) center/contain no-repeat}
.content{padding:8px 40px 80px;min-width:0}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}

/* ---------- blocks ---------- */
.card{background:var(--card);border-radius:22px;padding:24px 28px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card.tight{padding:18px 22px}
.hello h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:30px;font-weight:700;letter-spacing:-.015em}
.pagehead .sub{margin-top:4px}
.tools{display:flex;gap:12px;flex-wrap:wrap}
.field,.select{background:var(--field);border:1px solid transparent;border-radius:12px;padding:11px 16px;min-width:0;font-size:13.5px}
.field{width:240px;max-width:100%}
.field::placeholder{color:var(--ph)}
.field:focus{border-color:var(--blue-act);outline:none;background:var(--surf)}
.select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:600;font-size:13.5px;display:inline-block;text-align:center}
.btn:hover{filter:brightness(1.12)}
.btn.sm{padding:8px 16px;font-size:12.5px;border-radius:10px}
.btn.blue2{background:var(--blue-act)}
.btn.orange{background:var(--orange);color:#1f1300}
.btn.ghost{background:var(--surf);color:var(--blue-tx);border:1px solid var(--blue-tx)}
.btn.soft{background:var(--blue-soft);color:var(--blue-tx)}
.btn.danger{background:var(--red-soft);color:var(--red-ink)}
.btn.warn{background:var(--orange-soft);color:var(--orange-ink)}
.btn.block{display:block;width:100%}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.kpi{background:var(--card);border-radius:18px;padding:20px 22px 20px 26px;position:relative;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kpi::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--blue))}
.kl{color:var(--muted);font-size:13px}
.kv{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0;font-variant-numeric:tabular-nums}
.ks{font-size:12.5px;color:var(--muted)}
.ks.g{color:var(--green)} .ks.o{color:var(--orange)}

.promo{background:var(--green-soft);border-radius:22px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative}
.promo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green);border-radius:22px 0 0 22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.eyebrow.o{color:var(--orange)} .eyebrow.b{color:var(--blue-tx)}
.promo h2{font-size:24px;margin:4px 0 6px}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;background:var(--green-soft);color:var(--green-ink)}
.chip.o{background:var(--orange-soft);color:var(--orange-ink)} .chip.r{background:var(--red-soft);color:var(--red-ink)}
.chip.b{background:var(--blue-soft);color:var(--blue-tx)} .chip.n{background:var(--track);color:var(--muted)} .chip.g{background:var(--okchip);color:var(--green-ink)}
.chip.w{background:var(--surf)}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.card h2{font-size:18px;font-weight:700}
.card .sub{font-size:13px}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;background:var(--field);border-radius:10px;padding:10px 14px;font-size:13px;min-width:0}
.row b{font-weight:600;white-space:nowrap}
.row .grow{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{color:var(--muted);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--green)}
.dot.b{background:var(--blue)} .dot.o{background:var(--orange)} .dot.r{background:var(--red)}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--orange-soft);color:var(--orange-ink);font-size:11px;font-weight:700;margin-left:8px;vertical-align:middle}

/* course cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.course{background:var(--card);border-radius:22px;padding:22px 24px 24px;border-top:5px solid var(--c,var(--blue));box-shadow:0 1px 2px rgba(15,23,42,.04)}
.course h3{font-size:21px;font-weight:700}
.course .meta{color:var(--muted);font-size:13px;margin:6px 0}
.progress{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:14px}
.progress b{color:var(--ink)}
.track{height:7px;background:var(--track);border-radius:9px;overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:9px;background:var(--c,var(--blue))}
.course .btn{margin-top:16px}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--muted);padding:10px 18px;border-radius:12px;font-weight:500;font-size:13.5px}
.tab.on{background:var(--blue);color:#fff;font-weight:600}
.tabs.line .tab{border-radius:0;padding:8px 2px;margin-right:16px;border-bottom:2px solid transparent}
.tabs.line .tab.on{background:none;color:var(--ink);border-bottom-color:var(--blue-tx)}
.crumbs{font-size:13px;color:var(--muted)} .crumbs a:hover{color:var(--blue-tx)}
.back{font-size:13px;color:var(--blue-act);font-weight:500}

/* units */
.unit{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:20px 24px}
.unit .ic{width:22px;text-align:center;font-weight:700;color:var(--blue-tx)}
.unit .t{flex:1;min-width:0} .unit .t b{display:block}
.unit .t span{color:var(--muted);font-size:13px}
.st-g{color:var(--green-ink);font-weight:600;font-size:12.5px} .st-o{color:var(--orange);font-weight:600;font-size:12.5px} .st-n{color:var(--muted);font-weight:600;font-size:12.5px}
.lesson-formula{background:var(--field);border-radius:14px;padding:22px;text-align:center;color:var(--blue-tx);font-size:24px;font-weight:700;margin:16px 0}
.lesson-formula small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.example{background:var(--green-soft);border-radius:14px;padding:20px 22px}
.example b.f{display:block;font-size:19px;margin:6px 0}

/* tables */
.tscroll{overflow-x:auto;border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th{background:var(--thead);color:var(--blue-tx);font-weight:500;padding:12px 16px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:15px 16px;text-align:center;border-bottom:1px solid var(--line);background:var(--surf);white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--zebra)}
td:first-child{font-weight:600}
.plain th{background:none;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px}
.plain td{text-align:left;background:transparent!important;font-weight:400}
.plain td:first-child{font-weight:600}
.plain tbody tr:nth-child(even) td{background:transparent}
.link{color:var(--blue-act);font-weight:600;font-size:13px;background:none;border:0;padding:0}

/* bars */
.bars{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
.bar .track{margin:0;height:8px}
.bar b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.bar.wide{grid-template-columns:minmax(0,1fr) 54px;row-gap:6px}
.bar.wide .lab{grid-column:1/-1;color:var(--ink);font-weight:600}
.bar.wide .track{grid-column:1}
.bar.wide b{grid-column:2}
.barcard{background:var(--surf);border-radius:14px;padding:12px 18px}

/* settings */
.kv2{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px 16px;margin-top:16px;font-size:13px}
.kv2 span{color:var(--muted)} .kv2 b{font-weight:500}
.toggle{width:58px;height:30px;border-radius:99px;background:var(--toggle);border:0;position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--green)}
.toggle[aria-checked="true"]::after{transform:translateX(28px)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px}
.setrow b{display:block;font-size:14px}
.setrow span{color:var(--muted);font-size:12.5px}

/* forms */
.form label{display:block;font-weight:600;font-size:12.5px;margin:16px 0 6px}
.form .field,.form .select{width:100%;border:1px solid var(--line);background:var(--field)}
.form .half{width:220px;max-width:100%}
.form .actions{display:flex;justify-content:space-between;margin-top:36px;gap:12px}
.form h2{font-size:22px}

/* avatar / detail */
.avatar{width:72px;height:72px;border-radius:50%;background:var(--blue-act);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center;flex:none}
.profile{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:14px;max-width:300px}
.acts .btn{text-align:left;font-size:12.5px;padding:11px 16px}
.timeline{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.timeline div{display:flex;gap:12px;align-items:flex-start;font-size:13px}
.timeline small{display:block;color:var(--muted);font-size:11.5px}
.timeline .dot{margin-top:6px}

/* filter pills */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:8px 18px;font-size:12.5px;color:var(--muted)}
.pill.on{background:var(--blue-act);color:#fff;border-color:var(--blue-act);font-weight:600}

/* tutor */
.tutor-top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.tutor-top h1{font-size:28px;font-weight:700}
.seg{display:inline-flex;background:var(--field);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surf);color:var(--blue-tx);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.1)}
.curso-sel{display:flex;flex-direction:column;gap:2px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.curso-sel .select{background-color:var(--blue-soft);border:1px solid var(--line);font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.tutor-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.chatcard{display:flex;flex-direction:column;gap:14px;min-width:0}
.chathead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chathead .who{display:flex;gap:12px;align-items:center}
.who .avatar{width:38px;height:38px;font-size:15px}
.who b{font-size:17px;display:block}
.who span{font-size:12.5px;color:var(--muted)}
.thread{background:var(--thread);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;height:420px;overflow-y:auto}
.thread.empty{align-items:center;justify-content:center;text-align:center;background:var(--blue-soft)}
.thread.empty h2{font-size:24px}
.msg{max-width:84%;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.5;background:var(--surf);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--blue-act);color:#fff;border-color:var(--blue-act)}
.msg .src{display:inline-block;background:var(--blue-soft);color:var(--blue-tx);font-size:11.5px;font-weight:600;border-radius:8px;padding:6px 12px;margin-top:12px}
.msg .fb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.msg .fb button{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:5px 14px;font-size:12px;color:var(--blue-tx);font-weight:500}
.msg .fb button.on{background:var(--blue-soft);border-color:var(--blue-act)}
.typing{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:#94A3B8;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.suggest{display:flex;gap:10px;flex-wrap:wrap}
.suggest button{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:500;color:var(--blue-tx)}
.suggest button:hover{border-color:var(--blue-act)}
.thread.empty .suggest button{background:var(--surf);border:0}
.composer{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 18px}
.composer input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;padding:8px 0}
.composer input:focus{outline:none}
.composer:focus-within{border-color:var(--blue-act)}
.send{width:48px;height:44px;border-radius:12px;border:0;background:var(--blue-act);color:#fff;font-size:18px;flex:none}
.send.orange{background:var(--orange);color:#1f1300}
.aside h2{font-size:21px}
.mini{margin-top:18px}
.mini h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mini .it{display:flex;justify-content:space-between;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:8px;color:var(--muted);width:100%;text-align:left}
.mini .it.on{background:var(--blue-soft);color:var(--blue-tx);border-color:var(--blue-soft)}
.mini .it.sel{background:var(--surf);color:var(--ink);font-weight:500}
.pbox{background:var(--blue-soft);border-radius:14px;padding:14px 16px;margin-top:16px}
.pbox .pr{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pbox .pr b{font-size:20px;color:var(--blue-tx);letter-spacing:0}
.pbox .track{background:var(--surf)}
.pbox .track i{background:var(--blue-act)}
/* guided */
.goal{display:flex;gap:14px;align-items:center;background:var(--blue-soft);border-radius:14px;padding:16px 18px;flex-wrap:wrap}
.goal .tick{width:42px;height:42px;border-radius:50%;background:var(--blue-act);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.goal .tx{flex:1;min-width:200px}
.goal small{color:var(--muted)}
.goal .eyebrow{color:var(--blue-act)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1;min-width:90px;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:12px;font-weight:600;font-size:13px;color:var(--ink)}
.opt.on{background:var(--blue-act);color:#fff;border-color:var(--blue-act)}
.msg.ok{background:var(--okbg);border-color:var(--okline);max-width:100%}
.msg.no{background:var(--orange-soft);border-color:var(--noline);max-width:100%}
.msg.ok .lab{color:var(--green-ink)} .msg.no .lab{color:var(--orange-ink)}
.msg .lab{font-size:11px;font-weight:700;display:block;margin-bottom:4px}
.msg.tutor{background:var(--blue-100);border-color:var(--blue-100)}
.step{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;background:#64748B;flex:none}
.step.done{background:var(--okbg);border-color:var(--okbg)}.step.done .n{background:var(--green)}
.step.cur{background:var(--blue-soft);border-color:var(--blue-soft)}.step.cur .n{background:var(--blue-act)}
.step small{display:block;font-size:11px;color:var(--muted)}
.step.done small{color:var(--green-ink)} .step.cur small{color:var(--blue-act)}
.cc{display:flex;gap:10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:12.5px;font-weight:500}
.cc i{width:12px;height:12px;border-radius:50%;background:var(--green);flex:none}
.cc.off{color:var(--muted);background:var(--field)}.cc.off i{background:var(--track)}

/* login */
.login{min-height:100vh;background:var(--bg)}
.login .hero{background:var(--side);color:#fff;text-align:center;padding:72px 24px 200px;border-radius:0 0 40px 40px}
.login .hero h1{font-size:34px;font-weight:700}
.login .hero h2{font-size:24px;margin:14px 0 8px;font-weight:600}
.login .hero p{opacity:.9;font-size:15px}
.login .box{background:var(--surf);border-radius:28px;max-width:1100px;margin:-130px auto 0;padding:44px 56px 30px;box-shadow:0 8px 40px rgba(15,23,42,.08);width:calc(100% - 32px)}
.login .box h2{font-size:30px;font-weight:700}
.login .box .sub{margin-bottom:26px}
.fld{display:block;background:var(--field);border-radius:12px;padding:10px 18px;margin-bottom:16px;border:1px solid transparent}
.fld:focus-within{border-color:var(--blue-act);background:var(--surf)}
.fld span{display:block;font-weight:600;font-size:13px}
.fld input{display:block;width:100%;border:0;background:transparent;padding:2px 0;font-size:13.5px}
.fld input:focus{outline:none}
.fld input::placeholder{color:var(--ph)}
.loginrow{display:flex;justify-content:space-between;align-items:center;margin:2px 0 18px;font-size:13px;gap:12px;flex-wrap:wrap}
.loginrow label{display:flex;gap:8px;align-items:center}
.loginrow a{color:var(--blue-tx);font-weight:600;font-size:12.5px}
.loginbtn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:600}
.loginbtn:hover{filter:brightness(1.12)}
.roles{display:flex;gap:14px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.roles a{background:var(--blue-soft);color:var(--blue-tx);border-radius:99px;padding:11px 30px;font-size:13px;font-weight:600}
.roles a.on{background:var(--green);color:#fff}

/* chrome */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--inv);color:var(--inv-ink);border-radius:12px;padding:12px 20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.idx-btn{position:fixed;right:18px;bottom:18px;z-index:50;background:var(--inv);color:var(--inv-ink);border:0;border-radius:99px;padding:11px 18px;font-size:12.5px;font-weight:600;box-shadow:0 6px 24px rgba(15,23,42,.3)}
.idx{position:fixed;right:18px;bottom:68px;z-index:50;background:var(--surf);border-radius:18px;width:min(380px,calc(100% - 36px));max-height:70vh;overflow:auto;padding:18px 20px;box-shadow:0 12px 48px rgba(15,23,42,.25)}
.idx h4{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.idx h4:first-child{margin-top:0}
.idx a{display:block;padding:7px 10px;border-radius:8px;font-size:13px}
.idx a:hover,.idx a.on{background:var(--blue-soft);color:var(--blue-tx)}

/* ---------- Estilo del frontend del proyecto: formas en píldora, tipografía Caprasimo, movimiento fluido (colores de Figma) ---------- */
h1,h2,h3{font-family:var(--font-heading)!important;font-weight:400!important}
.kv,.sb-title{font-family:var(--font-heading);font-weight:400!important}
.card,.promo,.course,.tutor-top{border-radius:var(--radius-lg)}
.card{box-shadow:var(--shadow-sm)}
.card.tight{padding:20px 26px}
.kpi,.unit{border-radius:24px}
.kpi{box-shadow:var(--shadow-sm)}
.row{border-radius:16px}
.tscroll{border-radius:24px}
.lesson-formula,.example,.goal,.pbox{border-radius:20px}
.field,.select{border-radius:var(--radius-pill);padding:11px 20px}
.select{padding-right:38px}
.fld{border-radius:22px}
.btn{font-family:var(--font-heading);font-weight:400;border-radius:var(--radius-pill);padding:11px 24px;transition:filter .2s ease,transform .2s var(--ease)}
.btn.sm{padding:9px 20px}
.btn:active{transform:scale(.97)}
.tab,.pill{border-radius:var(--radius-pill)}
.course{overflow:hidden;position:relative;border-top:0;padding-top:30px}

  else{R.setAttribute('data-theme',P.theme);setByMe=true;}
  const d=isDark(),a=ACCENTS[P.accent],set=(k,v)=>v==null?R.style.removeProperty(k):R.style.setProperty(k,v);
  const all=['--blue','--blue-act','--blue-soft','--blue-100','--blue-200','--blue-300'];
  if(P.accent==='azul'){all.forEach(k=>set(k,null));}
  else if(d){all.forEach(k=>set(k,null));set('--blue-act',a.d);}
  else{const m=p=>`color-mix(in srgb,${a.l[1]} ${p}%,#fff)`;set('--blue',a.l[0]);set('--blue-act',a.l[1]);set('--blue-soft',m(11));set('--blue-100',m(11));set('--blue-200',m(20));set('--blue-300',m(34));}
  R.dataset.font=P.font;R.dataset.density=P.density;R.dataset.radius=P.radius;R.dataset.menu=P.menu;
  R.dataset.contrast=P.contrast==='1'?'high':'normal';R.dataset.motion=P.motion==='1'?'reduce':'normal';
  R.style.setProperty('--zoom',String(+P.size/100));
  const ib=document.getElementById('idxBtn');ib.hidden=P.idx!=='1';if(P.idx!=='1'){document.getElementById('idx').hidden=true;ib.setAttribute('aria-expanded','false');}
  try{localStorage.setItem('ffa-prefs',JSON.stringify(P));}catch(e){}
  syncPrefs();
}
function setPref(k,v){P[k]=v;applyPrefs();}
function syncPrefs(){
  document.querySelectorAll('[data-pref]').forEach(b=>b.setAttribute('aria-pressed',String(P[b.dataset.pref]===b.dataset.v)));
  document.querySelectorAll('[data-pref-toggle]').forEach(b=>b.setAttribute('aria-checked',String(P[b.dataset.prefToggle]==='1')));
  const tb=document.getElementById('themeBtn');
  if(tb){const d=isDark();tb.innerHTML=ic(d?'sun':'moon',22);tb.setAttribute('aria-label',d?'Cambiar a tema claro':'Cambiar a tema oscuro');tb.title=d?'Tema claro':'Tema oscuro';}
}
function themeSeg(){return `<div class="pseg themes" role="group" aria-label="Tema">${[['light','sun','Claro'],['dark','moon','Oscuro'],['auto','auto','Automático']].map(([v,i,l])=>`<button type="button" class="pb" data-pref="theme" data-v="${v}" aria-pressed="false">${ic(i,20)}${l}</button>`).join('')}</div>`;}
function pseg(k,opts,label){return `<div class="pseg" role="group" aria-label="${label}">${opts.map(([v,l,st])=>`<button type="button" class="pb" data-pref="${k}" data-v="${v}" aria-pressed="false"${st?` style="${st}"`:''}>${l}</button>`).join('')}</div>`;}
function ptog(k,t,s){return `<div class="ptoggle"><div><b id="pt-${k}">${t}</b><span>${s}</span></div><button type="button" class="toggle" role="switch" aria-checked="false" aria-labelledby="pt-${k}" data-pref-toggle="${k}"></button></div>`;}
function buildPrefs(){
  $('prefs').innerHTML=`<div class="ph"><div><h2 id="prefsT">Personalizar</h2><small>Ajusta la interfaz a tu gusto</small></div><button type="button" class="iconbtn" data-close-prefs aria-label="Cerrar personalización">${ic('x',22)}</button></div>
  <div class="pbody">
   <section><h3>Tema</h3>${themeSeg()}</section>
   <section><h3>Color de acento</h3><div class="swatches" role="group" aria-label="Color de acento">${Object.entries(ACCENTS).map(([k,a])=>`<button type="button" class="sw" style="--sw:${a.l[1]}" data-pref="accent" data-v="${k}" aria-label="${a.n}" aria-pressed="false">${ic('check',20)}</button>`).join('')}</div>
     <div class="swl" aria-hidden="true">${Object.values(ACCENTS).map(a=>`<span>${a.n}</span>`).join('')}</div>
     <div class="pprev"><span class="tick">${ic('check',18)}</span><div><b>Así se ve tu acento</b><span>Botones, enlaces y selecciones usan este color.</span></div></div></section>
   <section><h3>Tamaño del contenido</h3>${pseg('size',[['90','Pequeño'],['100','Normal'],['115','Grande'],['130','Muy grande']],'Tamaño del contenido')}</section>
   <section><h3>Tipografía</h3>${pseg('font',[['fig','Original'],['legible','Alta legibilidad',"font-family:'Atkinson Hyperlegible',system-ui,sans-serif"],['sistema','Del sistema','font-family:system-ui,sans-serif']],'Tipografía')}</section>
   <section><h3>Densidad</h3>${pseg('density',[['compact','Compacta'],['normal','Normal'],['comfortable','Amplia']],'Densidad')}</section>
   <section><h3>Esquinas</h3>${pseg('radius',[['pill','Redondeadas'],['soft','Suaves'],['sharp','Rectas']],'Estilo de esquinas')}</section>
   <section><h3>Menú lateral</h3>${pseg('menu',[['full','Con texto'],['rail','Solo íconos']],'Menú lateral')}<p class="pnote">«Solo íconos» se aplica en pantallas anchas.</p></section>
   <section><h3>Accesibilidad y otros</h3>${ptog('motion','Reducir animaciones','Menos movimiento en transiciones y entradas.')}${ptog('contrast','Alto contraste','Textos y bordes más marcados.')}${ptog('idx','Botón «Pantallas»','Acceso rápido a todas las pantallas del prototipo.')}</section>
  </div>
  <div class="pfoot"><small>Se guarda en este navegador.</small><button type="button" class="btn sm soft" data-prefs-reset>Restablecer</button></div>`;
}
function openPrefs(from){
  prefsOpener=from||null;prefsOpen=true;const p=$('prefs');p.inert=false;p.classList.add('open');$('pback').classList.add('open');
  const r=$('root');if(r)r.inert=true;
  setTimeout(()=>{const c=p.querySelector('[data-close-prefs]');if(c)c.focus();},40);
}
function closePrefs(){
  if(!prefsOpen)return;prefsOpen=false;const p=$('prefs');p.classList.remove('open');p.inert=true;$('pback').classList.remove('open');
  const r=$('root');if(r)r.inert=false;
  if(prefsOpener&&document.contains(prefsOpener))prefsOpener.focus();prefsOpener=null;
}
buildPrefs();
mqDark.addEventListener('change',applyPrefs);

try{ui.collapsed=localStorage.getItem('ffa-collapsed')==='1';}catch(e){ui.collapsed=false;}

function current(){const h=(location.hash||'').slice(1);return ROUTES[h]?h:'login-est';}
const isMobile=()=>mq.matches;

/* ---- marco: cabecera con logo + menú lateral minimizable ---- */
function buildShell(role){
  const n=NAV[role],u=USER[role];
  root.innerHTML=`<div class="app" id="app" data-collapsed="${ui.collapsed}" data-open="false">
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar" aria-label="Menú de navegación">
    <div class="sb-head"><button class="iconbtn light" id="sbClose" type="button" aria-label="Cerrar menú">${ic('x',22)}</button><span class="sb-title">Menú</span></div>
    <div class="sb-user"><span class="sb-av" aria-hidden="true">${u[0][0]}</span><div><b>${u[0]}</b><small>${u[1]}</small></div></div>
    <nav class="sb-nav" aria-label="Principal">${n.items.map(([k,l,r])=>`<a class="nav" data-key="${k}" href="#${r}" title="${l}">${ic(NAV_ICON[k])}<span>${l}</span></a>`).join('')}</nav>
    <div class="spacer"></div>
    <a class="nav" data-key="config" href="#${n.cfg}" title="Configuración">${ic('sliders')}<span>Configuración</span></a>
  </aside>
  <div class="stage">
    <header class="topbar">
      <button class="iconbtn" id="menuBtn" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Cerrar menú">${ic('menu',22)}</button>
      ${logo(48)}
      <div class="brand-col"><span class="brand-name">FeathersForAll.</span><span class="mode-label">${MODE_LABEL[role]}</span></div>
      <div class="roleswitch" role="group" aria-label="Cambiar de rol">${[['est','Estudiante'],['doc','Docente'],['adm','Admin']].map(([r,l])=>`<a class="rs ${r===role?'on':''}" href="#${r}-inicio" ${r===role?'aria-current="true"':''}>${l}</a>`).join('')}</div>
      <div class="tb-tools"><button type="button" class="iconbtn" id="themeBtn" aria-label="Cambiar tema" title="Cambiar tema"></button><button type="button" class="iconbtn" data-open-prefs aria-label="Personalizar la interfaz" title="Personalizar">${ic('palette',22)}</button></div>
    </header>
    <main class="content"><div class="wrap" id="wrap"></div></main>
  </div></div>`;
  shellRole=role;
  syncLayout();syncPrefs();
}
function updateNav(active){
  document.querySelectorAll('#sidebar .nav').forEach(a=>{const on=a.dataset.key===active;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
}
function menuClosed(){const a=$('app');return isMobile()?a.dataset.open!=='true':ui.collapsed;}
function syncLayout(){
  const a=$('app');if(!a)return;
  if(isMobile()){a.dataset.collapsed='true';}else{a.dataset.open='false';a.dataset.collapsed=String(ui.collapsed);}
  const c=menuClosed();
  $('sidebar').inert=c;
  const b=$('menuBtn');b.setAttribute('aria-expanded',String(!c));b.setAttribute('aria-label',c?'Abrir menú':'Cerrar menú');
}
function toggleMenu(){
  const a=$('app');if(!a)return;
  if(isMobile()){a.dataset.open=String(a.dataset.open!=='true');}
  else{ui.collapsed=!ui.collapsed;try{localStorage.setItem('ffa-collapsed',ui.collapsed?'1':'0');}catch(e){}}
  syncLayout();
  if(isMobile()){if(menuClosed())$('menuBtn').focus();else setTimeout(()=>{const c=$('sbClose');if(c)c.focus();},60);}
}
function closeMobileMenu(){const a=$('app');if(a&&isMobile()&&a.dataset.open==='true'){a.dataset.open='false';syncLayout();}}

/* ---- render: solo se cambia el contenido; el marco se conserva para que todo se sienta fluido ---- */
function scrollThread(smooth,keep){
  const t=$('thread');if(!t)return;
  if(keep!=null)t.scrollTop=keep;
  t.scrollTo({top:t.scrollHeight,behavior:smooth?'smooth':'auto'});
}
function render(mode,smooth){
  const id=current(),r=ROUTES[id]();
  const th=$('thread'),keep=th?th.scrollTop:0;
  if(r.login){shellRole=null;root.innerHTML=r.html;window.scrollTo(0,0);}
  else{
    if(shellRole!==r.role||!$('app'))buildShell(r.role);
    updateNav(r.active);
    const w=$('wrap'),y=window.scrollY;
    w.className='wrap'+(mode?' '+mode:'');
    w.innerHTML=r.content;
    window.scrollTo(0,mode==='enter'?0:y);
  }
  scrollThread(!!smooth&&mode!=='enter',mode==='enter'?0:keep);
  ui.seen=ui.chat.length;ui.chat.forEach(m=>{m.fresh=false;});ui.gAnim=false;
  buildIndex(id);
}
function buildIndex(id){
  document.getElementById('idx').innerHTML=INDEX.map(([g,l])=>`<h4>${g}</h4>${l.map(([r,n])=>`<a href="#${r}" class="${r===id?'on':''}">${n}</a>`).join('')}`).join('');
}
window.addEventListener('hashchange',()=>{
  render('enter');
  closeMobileMenu();
  document.getElementById('idx').hidden=true;document.getElementById('idxBtn').setAttribute('aria-expanded','false');
});
mq.addEventListener('change',syncLayout);

/* ---- avisos ---- */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---- chat del Tutor IA: escribe primero los puntos, luego la respuesta aparece palabra por palabra ---- */
function focusInput(){setTimeout(()=>{const i=document.getElementById('chat-input');if(i)i.focus({preventScroll:true});},0);}
function ask(q){
  q=(q||'').trim();if(!q||busy)return;
  busy=true;const run=ui.run;
  ui.chat.push({me:true,t:q});ui.typing=true;
  render(null,true);focusInput();
  const [full,src]=REPLIES[q]||DEFAULT_REPLY;
  setTimeout(()=>{
    if(run!==ui.run){busy=false;return;}
    const m={me:false,t:'',full,src,streaming:true};
    ui.typing=false;ui.chat.push(m);
    render(null,true);focusInput();
    const words=full.split(' ');let n=0;
    const iv=setInterval(()=>{
      if(run!==ui.run||!ui.chat.includes(m)){clearInterval(iv);busy=false;return;}
      n=Math.min(words.length,n+2);m.t=words.slice(0,n).join(' ');
      const el=document.querySelector('[data-stream]');
      if(el){el.textContent=m.t;scrollThread(true);}
      if(n>=words.length){clearInterval(iv);m.streaming=false;m.fresh=true;busy=false;if(current()==='est-tutor'){render(null,true);focusInput();}}
    },70);
  },850);
}

/* ---- interacciones ---- */
document.addEventListener('click',e=>{
  if(e.target.closest('#idxBtn')){const p=document.getElementById('idx');p.hidden=!p.hidden;document.getElementById('idxBtn').setAttribute('aria-expanded',String(!p.hidden));return;}
  const pb=e.target.closest('[data-pref]');if(pb){setPref(pb.dataset.pref,pb.dataset.v);return;}
  const pt=e.target.closest('[data-pref-toggle]');if(pt){const k=pt.dataset.prefToggle;setPref(k,P[k]==='1'?'0':'1');return;}
  const op=e.target.closest('[data-open-prefs]');if(op){openPrefs(op);return;}
  if(e.target.closest('[data-close-prefs]')){closePrefs();return;}
  if(e.target.closest('#themeBtn')){setPref('theme',isDark()?'light':'dark');return;}
  if(e.target.closest('[data-prefs-reset]')){Object.assign(P,PREF_DEF);applyPrefs();toast('Personalización restablecida');return;}
  if(e.target.closest('#menuBtn')){toggleMenu();return;}
  if(e.target.closest('#sbClose')||e.target.closest('#backdrop')){if(isMobile()&&$('app').dataset.open==='true')toggleMenu();return;}
  const t=e.target.closest('[data-tab]');
  if(t){const [k,v]=t.dataset.tab.split(':');ui.tab[k]=v;render('soft');return;}
  const a=e.target.closest('[data-act]');
  if(!a)return;
  const act=a.dataset.act;
  if(act==='toast'){e.preventDefault();toast(a.dataset.msg||NOT_IN_FIGMA);return;}
  if(act==='mode'){ui.tutorMode=a.dataset.v;render('soft');return;}
  if(act==='ask'){ask(a.dataset.q);return;}
  if(act==='reset'){ui.run++;ui.chat=[];ui.fb={};ui.typing=false;busy=false;ui.seen=0;render('soft');return;}
  if(act==='fb'){const i=a.dataset.i;ui.fb[i]=ui.fb[i]===a.dataset.v?null:a.dataset.v;render();return;}
  if(act==='copy'){const m=ui.chat[+a.dataset.i];const txt=m?m.t:'';
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Respuesta copiada')).catch(()=>toast('No se pudo copiar. Selecciona el texto y cópialo.'));return;}
  if(act==='guess'){ui.guided=a.dataset.v;ui.gAnim=true;render();return;}
  if(act==='notif'){const r=a.dataset.role;ui.notif[r]=!ui.notif[r];render();toast(ui.notif[r]?'Notificaciones activadas':'Notificaciones desactivadas');return;}
  if(act==='evf'){ui.evf=a.dataset.v;render('soft');return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(prefsOpen){closePrefs();return;}if(shellRole)closeMobileMenu();}
  if(e.key==='Tab'&&prefsOpen){const f=[...$('prefs').querySelectorAll('button:not([disabled])')];if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
});

document.addEventListener('input',e=>{
  const f=e.target.closest('[data-filter]');if(!f)return;
  const q=f.value.trim().toLowerCase();
  document.querySelectorAll(f.dataset.filter).forEach(el=>{el.hidden=!!q&&!el.textContent.toLowerCase().includes(q);});
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const k=f.dataset.form;
  if(k==='login'){location.hash=f.dataset.role+'-inicio';return;}
  if(k==='chat'){const i=document.getElementById('chat-input');const v=i.value;i.value='';ask(v);return;}
  if(k==='guided'){const i=document.getElementById('guided-input');const v=i.value.trim();i.value='';if(v)toast('El tutor responde con una pista en la sesión real.');return;}
  const d=Object.fromEntries(new FormData(f).entries());
  if(k==='colegio'){COLEGIOS.push({n:d.nombre||'Nuevo colegio',c:d.comuna||'—',u:0,k:0,e:d.estado||'Activo'});toast('Colegio agregado (ejemplo)');}
  if(k==='usuario'){USUARIOS.push({n:((d.nombres||'')+' '+(d.apellidos||'')).trim()||'Nuevo usuario',m:'nuevo@colegio.cl',r:d.tipo||'Estudiante',c:d.curso||'—',e:d.estado||'Activo'});toast('Usuario agregado (ejemplo)');}
  if(k==='curso'){ADM_CURSOS.push({n:d.nombre||'Nuevo curso',l:d.nivel||'—',d:d.docente&&d.docente!=='Seleccionar docente'?d.docente:'Sin asignar',a:0,e:d.estado||'Activo'});toast('Curso agregado (ejemplo)');}
  location.hash=f.dataset.back;
});

applyPrefs();
render('enter');
})();
</script>


</body></html>
