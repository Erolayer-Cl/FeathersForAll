# API (Node + Express) y frontend (NGINX). Ambos stateless: el estado vive en PostgreSQL, fuera del clúster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffa-api
  labels:
    app.kubernetes.io/name: ffa-api
    app.kubernetes.io/component: api
spec:
  # Sin "replicas": las decide el HPA (mínimo 2). Así un `kubectl apply` no pisa el escalado.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # nunca baja de la capacidad actual al desplegar
  selector:
    matchLabels:
      app.kubernetes.io/name: ffa-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ffa-api
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false     # la API no habla con el API server de Kubernetes
      terminationGracePeriodSeconds: 15        # server.js cierra en máx. 10 s (12-Factor IX)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532                       # "nonroot" de distroless
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: feathersforall-api            # Kustomize lo reemplaza por ghcr.io/...@sha256:...
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: ffa-api-config }
            - secretRef: { name: ffa-api-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 2
            failureThreshold: 15
          # Readiness: sin BD el pod sale del Service (no recibe tráfico) pero NO se reinicia.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: solo "el proceso responde". No depende de Ollama ni de la BD.
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffa-web
  labels:
    app.kubernetes.io/name: ffa-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ffa-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ffa-web
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                         # usuario nginx de nginx-unprivileged
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: feathersforall-web
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "64Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # NGINX escribe pid y temporales en /tmp
          readinessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
