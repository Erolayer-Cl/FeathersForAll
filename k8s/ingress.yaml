# Ruteo HTTP L7: /v1 y /health → API, todo lo demás → frontend. Un solo origen: sin CORS.
# Controlador: ingress-nginx (k8s/README.md, paso 1). TLS: en el clúster local no; en un ambiente real
# se agrega `tls:` con un certificado de cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feathersforall
  annotations:
    # El chat responde en streaming: sin buffer, el texto llega a medida que el LLM lo genera.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # El resto de la API no recibe cuerpos grandes (JSON de hasta 100 kB); los apuntes van por el Ingress de abajo.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service: { name: ffa-api, port: { name: http } }
          - path: /health
            pathType: Exact
            backend:
              service: { name: ffa-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: ffa-web, port: { name: http } }
---
# /v1/courses aparte: el docente sube apuntes de hasta 40 MB (PUT /v1/courses/{id}/documents/{nombre}, contrato v1.3)
# y el servidor responde recién cuando terminó de indexarlos (un PDF largo tarda minutos con Ollama en CPU).
# ingress-nginx elige el prefijo más largo, así que estas anotaciones solo valen bajo /v1/courses.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feathersforall-cursos
  annotations:
    # Las conversaciones del tutor (/v1/courses/{id}/tutor-conversations/...) también responden en streaming.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "40m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/courses
            pathType: Prefix
            backend:
              service: { name: ffa-api, port: { name: http } }
