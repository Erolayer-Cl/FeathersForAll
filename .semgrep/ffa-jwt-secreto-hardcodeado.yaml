rules:
  - id: ffa-jwt-secreto-hardcodeado
    message: >-
      Secreto JWT escrito en el código. Quien lea el repo (o su historial) puede firmar tokens de
      cualquier colegio y rol. Léelo de process.env.JWT_SECRET sin valor por defecto: sin secreto,
      la API rechaza todo (fail-closed, src/platform/auth.js).
    severity: ERROR
    languages: [javascript]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      stride: Spoofing
    paths:
      exclude:
        - "**/test/**"
        - "*.test.js"
    pattern-either:
      # Firmar o verificar con un literal (también vía const: Semgrep propaga constantes).
      - pattern: signJwt($CLAIMS, "...", ...)
      - pattern: verifyJwt($TOKEN, "...")
      - pattern: requireAuth("...")
      - pattern: optionalAuth("...")
      - pattern: createHmac($ALG, "...")
      # Valor por defecto para el secreto: si falta la variable, la API arranca igual con uno conocido.
      - pattern: process.env.JWT_SECRET || "..."
      - pattern: process.env.JWT_SECRET ?? "..."
