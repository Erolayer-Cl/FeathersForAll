# gitleaks (S09, ADR 0010): reglas por defecto + excepciones para los fixtures SINTÉTICOS del repo.
#
# Regla del taller: cada excepción explica por qué NO es un secreto. Nunca se agrega una ruta
# completa "para que pase": si gitleaks encuentra un secreto real, se ROTA (aunque se borre en un
# commit posterior, sigue en el historial) y se registra en Documentos/seguridad/vulnerabilidades.md.
title = "FeathersForAll"

[extend]
useDefault = true

[[allowlists]]
description = "Fixtures sintéticos de pruebas (no dan acceso a nada)"
regexes = [
  # JWT falsos de la carpeta "7 · Seguridad" de Postman: firma inválida y alg "none" (deben dar 401).
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ4In0\.firma-falsa''',
  '''eyJhbGciOiJub25lIn0\.[A-Za-z0-9_-]+\.?''',
  # Secreto HS256 de las pruebas unitarias (test/*.test.js); no se usa en ningún ambiente.
  '''secreto-de-pruebas-con-mas-de-32-caracteres''',
  # Hashes scrypt de la clave demo "demo1234" en el seed sintético (90_seed_demo.sql) y en pruebas.
  '''scrypt\$16384\$8\$[0-9]+\$[A-Za-z0-9_-]+\$[A-Za-z0-9_-]+''',
]

# Idempotency-Key de los ejemplos del contrato (api/examples/*.json): son UUID de ejemplo que el
# cliente inventa en cada request (contrato S05), no credenciales. gitleaks los marca como
# "generic-api-key" por la palabra "Key". Se exceptúa solo esa línea y solo en esa carpeta.
[[allowlists]]
description = "Idempotency-Key (UUID de ejemplo) en los ejemplos del contrato"
condition = "AND"
regexTarget = "line"
paths = ['''^FeathersForAll/api/examples/[^/]+\.json$''']
regexes = ['''"Idempotency-Key":\s*"[0-9a-fA-F-]{36}"''']

# Idempotency-Key de prueba en el cliente del portal: un UUID inventado en el test (`const KEY = '…'`) para
# comprobar que la cabecera viaja. No es una credencial; gitleaks lo marca como "generic-api-key" por llamarse KEY.
# Se exceptúa solo esa línea y solo en ese archivo (el historial ya la contiene, así que la prueba nueva no basta).
[[allowlists]]
description = "UUID de Idempotency-Key en portalApi.test.js"
condition = "AND"
regexTarget = "line"
paths = ['''^code/frontend/src/api/portalApi\.test\.js$''']
regexes = ['''const KEY = '[0-9a-fA-F-]{36}';''']

# Contraseñas SINTÉTICAS de las pruebas de gestión de usuarios (v1.12): claves que la prueba elige para restablecer o
# cambiar la de una cuenta demo en una base temporal que se borra al terminar. No existen en ningún ambiente.
# Y el NOMBRE de una variable de la colección Postman (v112_pregunta), que gitleaks toma por un valor junto a "key".
# Se exceptúan solo esos valores exactos y solo en esos dos archivos (el historial ya los contiene).
[[allowlists]]
description = "Claves sintéticas de test/usuarios.pg.test.js y variable v112_pregunta de Postman"
condition = "AND"
paths = ['''^code/backend/test/usuarios\.pg\.test\.js$''', '''^code/backend/requests/postman/FeathersForAll\.postman_collection\.json$''']
regexes = ['''^(otra-clave-123|luis-nueva-123|v112_pregunta)$''']
