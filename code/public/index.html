<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeathersForAll · Tutor IA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <h1>Tutor IA</h1>
      <span class="chat__status" id="status">verificando…</span>
    </header>

    <ol class="chat__messages" id="messages" aria-live="polite">
      <li class="bubble bubble--assistant">Hola, soy el tutor de FeathersForAll. ¿En qué te ayudo?</li>
    </ol>

    <form class="chat__form" id="form">
      <textarea id="input" rows="1" placeholder="Escribe tu pregunta… (Enter envía, Shift+Enter salto de línea)" maxlength="4000" required></textarea>
      <button type="submit" id="send">Enviar</button>
    </form>
  </main>

  <script type="module" src="chat.js"></script>
</body>
</html>
