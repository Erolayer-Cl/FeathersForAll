# Sirve el build de Vite. La API (/v1, /health) la enruta el Ingress, no NGINX.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /livez { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Portal por rol (Estudiante · Docente · Administrador): segunda entrada del build de Vite.
  location = /portal { return 302 /portal.html; }

  # Archivos con hash en el nombre: caché larga.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # SPA: cualquier otra ruta cae en index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
  }
}
