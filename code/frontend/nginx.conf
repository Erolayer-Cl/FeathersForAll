# Sirve el build de Vite. La API (/v1, /health) la enruta el Ingress, no NGINX.
# Cabeceras de seguridad (CSP, anti-clickjacking…): /etc/nginx/snippets/security-headers.conf.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /livez { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Portal por rol (Estudiante · Docente · Administrador): segunda entrada del build de Vite.
  location = /portal {
    include /etc/nginx/snippets/security-headers.conf;
    return 302 /portal.html;
  }

  # Archivos con hash en el nombre: caché larga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA: cualquier otra ruta cae en index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
