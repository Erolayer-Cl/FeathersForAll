# Cabeceras de seguridad del frontend (S10: hallazgo del DAST y amenaza S-4 del threat model).
# NGINX no hereda add_header dentro de un location que define los suyos, por eso este archivo se
# incluye en cada location de nginx.conf en vez de declararse una sola vez en el server.
#
# CSP: todo sale del propio sitio. Las únicas excepciones son las fuentes de Google Fonts.
#   - Sin 'unsafe-inline' ni 'unsafe-eval': un XSS no puede ejecutar script inyectado ni enviar
#     el token a otro dominio (connect-src 'self').
#   - Si el build usa VITE_API_URL con otro dominio, hay que agregarlo a connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
